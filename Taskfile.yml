# Frequently used commands for this project.
#
#   task            list every available task
#   task <name>     run one
#   task bo -- optim.method.budget.n_iter=50
#                   everything after `--` is forwarded to the command
#   task pipeline   every stage, simulation through evaluation
#
# Task runs commands through its own POSIX shell interpreter, so these work
# identically on Windows, macOS and Linux. Avoid platform binaries (rm, find)
# in new tasks — shell out to `uv run python -c ...` instead.
version: "3"

# MLFLOW_TRACKING_URI and friends; a missing .env is ignored.
dotenv: [".env"]

vars:
  PKG: src
  # The search methods `optim` loops over. Adding one is a folder under
  # src/optim/methods/, its SEARCHES entry, a configs/optim/method/<name>.yaml,
  # and its name here.
  METHODS: mobo random rule

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # --- environment ---------------------------------------------------------

  setup:
    desc: Create the environment with every extra and install git hooks
    cmds:
      - uv sync --all-extras
      - uv run pre-commit install

  sync:
    desc: Install the base + dev environment (no Sionna-RT, no optimizers)
    cmds:
      - uv sync --extra dev --extra notebooks --extra viz

  sync:rt:
    desc: Install the base + dev environment plus Sionna-RT (needs a CUDA GPU)
    cmds:
      - uv sync --extra dev --extra notebooks --extra viz --extra rt

  lock:
    desc: Resolve dependencies and write uv.lock
    cmds:
      - uv lock

  upgrade:
    desc: Move every pin to the newest version allowed by pyproject.toml
    cmds:
      - uv lock --upgrade
      - uv sync --all-extras

  add:
    desc: 'Add a dependency, e.g. task add -- lightgbm'
    cmds:
      - uv add {{.CLI_ARGS}}

  add:dev:
    desc: 'Add a dev dependency, e.g. task add:dev -- mypy'
    cmds:
      - uv add --optional dev {{.CLI_ARGS}}

  # --- quality -------------------------------------------------------------

  lint:
    desc: Lint with ruff (includes docstring rules)
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  format:
    desc: Auto-format and auto-fix with ruff
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  check:
    desc: Lint and test
    cmds:
      - task: lint
      - task: test

  # --- pipeline ------------------------------------------------------------

  lab:
    desc: Start JupyterLab
    cmds:
      - uv run jupyter lab

  simulation:layout:
    desc: 'Print the transmitter node table for configs/simulation.yaml (one-off)'
    cmds:
      - uv run python -m {{.PKG}}.simulation.transmitter {{.CLI_ARGS}}

  simulation:scenario:
    desc: 'Stage 1 - raster the scene and draw the UE population (needs a CUDA GPU)'
    cmds:
      - uv run python -m {{.PKG}}.simulation.scenario {{.CLI_ARGS}}

  simulation:radio:
    desc: 'Stage 2 - ray-trace the clean radio map, one solve per band'
    cmds:
      - uv run python -m {{.PKG}}.simulation.radio {{.CLI_ARGS}}

  simulation:mdt:
    desc: 'Stage 3 - sample the radio map at the UEs and add measurement noise'
    cmds:
      - uv run python -m {{.PKG}}.simulation.mdt {{.CLI_ARGS}}

  simulation:
    desc: 'Run all three simulation stages in order'
    cmds:
      - task: simulation:scenario
      - task: simulation:radio
      - task: simulation:mdt

  preprocess:
    desc: 'Verify the simulation output and write the processed tables (notebook 02)'
    cmds:
      - uv run python -m {{.PKG}}.data.build {{.CLI_ARGS}}

  bo:
    desc: 'Optimize with MOBO, e.g. task bo -- optim.method.budget.n_iter=50 - needs a GPU'
    cmds:
      - uv run python -m {{.PKG}}.optim.run optim/method=mobo {{.CLI_ARGS}}

  baseline:
    desc: 'Optimize with a baseline method, e.g. task baseline -- optim/method=rule - needs a GPU'
    cmds:
      - uv run python -m {{.PKG}}.optim.run optim/method=random {{.CLI_ARGS}}

  optim:
    desc: 'Optimize with every method in METHODS - needs a GPU'
    cmds:
      - for: { var: METHODS }
        cmd: uv run python -m {{.PKG}}.optim.run optim/method={{.ITEM}} {{.CLI_ARGS}}

  evaluate:
    desc: 'Compare the newest run of each method, write reports/ (notebook 05)'
    cmds:
      - uv run python -m {{.PKG}}.evaluation.run {{.CLI_ARGS}}

  pipeline:
    desc: 'Every stage in order: simulation, preprocess, optim, evaluate'
    cmds:
      - task: simulation
      - task: preprocess
      - task: optim
      - task: evaluate

  sweep:
    desc: 'Hydra multirun, e.g. task sweep -- seed=1,2,3'
    cmds:
      - uv run python -m {{.PKG}}.optim.run --multirun {{.CLI_ARGS}}

  # --- versioning and tracking ---------------------------------------------

  dvc:init:
    desc: Initialise DVC in this repository
    cmds:
      - uv run dvc init

  dvc:repro:
    desc: Reproduce the DVC pipeline
    cmds:
      - uv run dvc repro {{.CLI_ARGS}}

  dvc:dag:
    desc: Show the DVC stage graph
    cmds:
      - uv run dvc dag

  dvc:push:
    desc: Push tracked data and artifacts to the DVC remote
    cmds:
      - uv run dvc push

  dvc:pull:
    desc: Pull tracked data and artifacts from the DVC remote
    cmds:
      - uv run dvc pull

  mlflow:
    desc: Serve the MLflow UI on MLFLOW_TRACKING_URI (default sqlite:///mlflow.db)
    cmds:
      - uv run mlflow ui --backend-store-uri ${MLFLOW_TRACKING_URI:-sqlite:///mlflow.db}

  # --- housekeeping --------------------------------------------------------

  clean:
    desc: Remove caches and compiled files
    cmds:
      - uv run --no-project python -c "import pathlib, shutil; [shutil.rmtree(p, ignore_errors=True) for p in pathlib.Path('.').rglob('__pycache__')]"
      - uv run --no-project python -c "import pathlib, shutil; [shutil.rmtree(p, ignore_errors=True) for p in ['.pytest_cache', '.ruff_cache']]"
