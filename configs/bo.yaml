# @package bo
# Optimization over the absolute-tilt space: one tilt per cell-band pair.

# Which search to run: mobo (Ax multi-objective BO), random (Sobol at the same
# budget, the control), or rule (one shared tilt per band, swept).
method: mobo

budget:
  # Sobol trials before the model takes over.
  n_init: 32
  # Model-driven evaluations after it does.
  n_iter: 128
  # Trials asked for per round. Ax may return fewer.
  batch_size: 4

# The rule-based sweep only.
rule:
  # Tilt values tried per band, per pass, spanning that band's bounds.
  n_steps: 5
  # Coordinate-descent passes over the bands.
  n_rounds: 2

output:
  # One directory per run, under <dir>/<method>/<timestamp>. Deliberately not
  # Hydra's run directory: notebooks compose the config rather than going
  # through @hydra.main, so they would otherwise write nowhere.
  dir: outputs/optim
  # Whether to archive the winning configuration's radio map. It is written in
  # the same schema as the simulation stage, so src/kpi reads it unchanged.
  save_radio_map: true

# Ray-tracing fidelity is deliberately absent: the search runs at
# simulation.radio_map.samples_per_tx. Dropping it a decade barely moves the
# wall clock while shifting every KPI well beyond the solver's own noise, so a
# cheaper search would optimize a different problem rather than the same one
# for less.
#
# Budget accordingly: an evaluation costs tens of seconds of ray tracing, and
# Ax's candidate generation grows with the observation count on top of that.
# The defaults below are a run measured in hours, not minutes.

seed: ${seed}
