defaults:
  - simulation
  - _self_

# Global seed.
seed: 42

project_name: band-tilt

mlflow:
  tracking_uri: ./mlruns
  experiment_name: band-tilt

# Hydra's own output directories. Runs are reproducible from the config Hydra
# saves next to each run, so keep this on.
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
