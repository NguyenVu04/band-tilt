# Hydra entrypoint. Composes the data contract, the radio/band declaration, the
# KPI definition, the surrogate, and exactly one optimizer.
#
# Override from the command line:
#   python -m src.optim.bo.run
#   python -m src.optim.marl.train optim=marl
#   python -m src.surrogate.train seed=7 surrogate.train.max_epochs=50
#   python -m src.optim.bo.run --multirun seed=1,2,3
#
# In notebooks the @hydra.main decorator does not work — use the Compose API
# via src.config.load_config().
#
# Each composed file declares its own package (`# @package <name>` header), so
# the merged config is namespaced: cfg.data.*, cfg.mobility.*, cfg.radio.*,
# cfg.kpi.*, cfg.surrogate.*, cfg.optim.*. Nothing merges into the root except
# the keys below, which keeps a new config group from silently shadowing an
# existing key.

defaults:
  - data
  - mobility
  - radio
  - kpi
  - surrogate
  - optim: bo
  - _self_

# Global seed. Consumed by src.utils.seed.set_seed(), by the splitter, by the
# tilt sampler and by both optimizers. Change it here only, never per module.
# Reported results must state the seed set they were averaged over.
seed: 42

project_name: band-tilt

mlflow:
  tracking_uri: ./mlruns
  experiment_name: band-tilt

# Hydra's own output directories. Runs are reproducible from the config Hydra
# saves next to each run, so keep this on.
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
