defaults:
  - simulation
  - kpi
  - data
  - optim/base
  - optim/method: turbo
  - _self_

# Global seed.
seed: 42

# Notebook and `task evaluate` tables and figures, one subdirectory per notebook.
reports:
  figures_dir: reports/figures
  tables_dir: reports/tables

# MLflow tracking; MLFLOW_TRACKING_URI in .env overrides the URI.
mlflow:
  enabled: false
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlflow.db}
  experiment_name: band-tilt

# Hydra output directories.
hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
