# @package data
# The verified, typed artifacts src/data/build.py writes from the simulation
# output, via `task preprocess`. Notebook 02 calls the same functions.

output:
  # The UE population after schema verification and typing, one row per UE
  # per interval, including UEs no cell reaches.
  ue_file: data/processed/ue.parquet
  # One row per cell-band pair: the configuration the radio map was solved at,
  # and the baseline every DeltaTilt is measured against.
  cell_file: data/processed/cell.parquet
  # The MDT subset of the UE table, typed, carrying the PRBs each report
  # required. The demand map is built from it; nothing else scores on it.
  mdt_file: data/processed/mdt.parquet
  # The demand map: median requested PRB per tile, and the KDE tile weights
  # src/optim/objective.py averages its per-tile utility against.
  demand_file: data/processed/demand.npz

# The demand map (src/data/demand.py, ADR 0007). Changing either value changes
# what the objective optimises, so runs either side of a change are not
# comparable.
demand:
  # Standard deviation of the KDE's Gaussian kernel, in scene metres. Given
  # explicitly rather than by Scott's or Silverman's rule: those scale with the
  # spread of the samples, which here is the study area, and flatten the
  # hotspots the map exists to find.
  bandwidth_m: 150.0
  # Share of the weight spread evenly over every tile, blended in after the
  # KDE. Zero lets the objective ignore ground the MDT never reported.
  uniform_share: 0.0
