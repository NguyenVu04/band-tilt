# @package data
# Single source of truth for input paths, the MDT/cell-config data contract,
# and the split scheme.
#
# MDT is SYNTHETIC: SUMO generates UE
# trajectories over the road network, Sionna-RT evaluates RSRP along them, and
# the records below are the result. It is not an operator export. The schema is
# the same either way — the difference is that a scenario can be regenerated,
# perturbed and split as a unit, which is what the sim-to-reality study needs.
#
# Enforcement lives in src/data/schema.py: this file declares *what* is true,
# the Python module holds the logic that checks it. If a constraint needs
# cross-column or conditional logic, express it in schema.py rather than
# growing this file into a rule engine.

# --- Paths -----------------------------------------------------------------
# Relative to the project root. Everything under data/ is DVC-tracked.
#
# `cell_config_path` is today's single-band export: one row per gcell, with a
# single `digital_tilt` and no band, carrier frequency or transmit power. The
# multi-band export the cell-band table requires has not arrived yet;
# when it does, point `cell_config_path` at it and fill in the placeholder
# columns under `schema.cell_config` below.
#
# Two copies of this export exist with genuinely different sim_x/sim_y — not a
# constant offset apart, so not the same coordinate frame. `external/` is used
# here because it sits beside `data.scene_file` and was delivered on the same
# date; `raw/gcell_conf.csv` is the other candidate and has not been reconciled
# against the scene.
#
# `mdt_path` points at the retired operator export. MDT is generated instead
# — SUMO trajectories through Sionna-RT — and
# the generation stage does not exist yet. Do not treat the file below as the
# spec'd input; see CLAUDE.md, Known gaps.
mdt_path: data/raw/measurement_data.csv
cell_config_path: data/external/gcell_conf.csv

# The Sionna-RT scene. Read by src/radio/scene.py.
scene_dir: data/external/simulation_map
scene_file: data/external/simulation_map/scene.xml

interim_dir: data/interim
processed_dir: data/processed
train_path: data/processed/mdt_train.parquet
test_path: data/processed/mdt_test.parquet

# --- Cleaning --------------------------------------------------------------
# Every rule here is a hard rule — a record either violates a declared bound or
# it does not. Statistical outlier handling is a modelling choice and does not
# belong in the cleaning stage.
#
# These rules were written for the operator export. Synthetic MDT is generated
# in-range by construction, so most of them become assertions rather than
# filters — which is a better use for them, not a reason to drop them.
clean:
  drop_duplicates: true
  # Drop MDT records whose RSRP falls outside the reportable range declared in
  # `schema.mdt.rsrp`. The raw export contains rsrp = 0.0, which is not a
  # measurable RSRP value and is treated as a sentinel for "no report".
  drop_rsrp_out_of_range: true
  # Drop records whose gcell_id has no row in the cell configuration; a
  # measurement against an unknown cell cannot be placed in the scene.
  drop_unknown_cells: true
  # Drop records outside the scene bounding box; they cannot be gridded.
  drop_outside_scene: true

# --- Split -----------------------------------------------------------------
# ALL split configuration lives here.
#
# The boundary falls between SCENARIOS (src/data/split.py). A
# scenario is one environment — buildings, dimensions, materials — plus one UE
# mobility realisation. Everything inside it shares those, so a split that cuts
# through one leaks them.
#
# This is not only ordinary leakage hygiene. The question the held-out set has to
# answer is a sim-to-reality one: does the surrogate, and the
# configuration it produced, survive an environment it was never fitted on? A
# record-level split cannot answer that — it measures interpolation inside one
# scene and reports it as generalisation. That is a known failure
# mode outright.
#
# method: scenario | spatial_block | temporal | group_shuffle | random
#   scenario       hold out whole scenarios — THE ONLY ONE VALID FOR A REPORTED
#                  RESULT; tests transfer to unseen environments and mobility
#   spatial_block  hold out whole grid blocks within a scenario — a diagnostic
#                  of spatial transfer, not a generalisation estimate
#   temporal       hold out the tail of the observation window — likewise
#   group_shuffle  hold out whole groups of `group_col`
#   random         provided only so the leakage cost can be demonstrated;
#                  never use it for a reported result
split:
  method: scenario
  # Column identifying the scenario a record belongs to, for method: scenario.
  # Not yet emitted by the pipeline — see CLAUDE.md, Known gaps.
  scenario_col: scenario_id
  group_col: ue_id
  # Edge length in metres of one held-out block, for method: spatial_block.
  block_size_m: 250.0
  # Cut point for method: temporal. null means "use test_size as a fraction of
  # the observation window, latest records held out".
  cutoff_date: null
  seed: 42
  test_size: 0.2
  val_size: 0.2 # fraction of the *train* split, not of the full dataset

# --- Schema ----------------------------------------------------------------
# One entry per column that must exist after loading. `min` / `max` are HARD
# bounds only: physical limits, specification ranges, or values fixed by a
# standard — anything knowable before seeing the data. Record the source of
# every bound in the `source` field; it is the audit trail that proves the
# threshold was not derived from the data.
#
# Never put a data-derived threshold (mean, std, quantile, IQR fence) here.
schema:
  # MDT records.
  mdt:
    columns:
      ue_id:
        dtype: string
        nullable: false
        source: MDT export; opaque identifier, never a feature
      sim_x:
        dtype: float64
        nullable: false
        source: scene local coordinate frame, metres (see scene.xml)
      sim_y:
        dtype: float64
        nullable: false
        source: scene local coordinate frame, metres (see scene.xml)
      date:
        dtype: datetime64[ns, UTC]
        nullable: false
        source: MDT export timestamp
      rsrp:
        dtype: float64
        min: -156.0
        max: -31.0
        nullable: false
        source: 3GPP TS 38.133 NR RSRP reporting range (RSRP_0..RSRP_127)
      gcell_id:
        dtype: string
        nullable: false
        source: joins to schema.cell_config.gcell_id
      ue_height:
        dtype: float64
        min: 0.0
        max: 200.0
        nullable: false
        source: UE above ground level; upper bound is the scene building height
      scenario_id:
        dtype: string
        nullable: false
        source: src.data.scenario.scenario_id; a deterministic hash of the
          scenario definition. What split.scenario_col below names.

  # Cell configuration.
  cell_config:
    columns:
      gcell_id:
        dtype: string
        nullable: false
        source: cell identifier; primary key
      gnodeb_id:
        dtype: string
        nullable: false
        source: site identifier; the alternative MARL agent granularity
      sim_x:
        dtype: float64
        nullable: false
        source: scene local coordinate frame, metres
      sim_y:
        dtype: float64
        nullable: false
        source: scene local coordinate frame, metres
      antenna_height:
        dtype: float64
        min: 0.0
        max: 200.0
        nullable: false
        source: antenna above ground level, metres
      azimuth:
        dtype: float64
        min: 0.0
        max: 360.0
        nullable: false
        source: compass bearing; converted by src/radio/geometry.py
      digital_tilt:
        dtype: float64
        min: 0.0
        max: 90.0
        nullable: false
        source: physical downtilt range; per-cell-band optimization bounds are
          declared in configs/radio.yaml, not here

      # --- Pending the multi-band export -----------------------------------
      # These columns do not exist in data/raw/gcell_conf.csv. The cell-band
      # table requires all of them, and
      # tilt = eTilt + mTilt, which today's single `digital_tilt` cannot
      # express. Fill each entry in and remove this comment when the
      # multi-band export lands. Until then src/data/schema.py must be called
      # with strict=False for the cell configuration.
      <band-column>:
        dtype: string
        nullable: false
        source: <where the band identifier set is defined>
      <etilt-column>:
        dtype: float64
        min: 0.0
        max: 90.0
        nullable: false
        source: <electrical tilt, degrees>
      <mtilt-column>:
        dtype: float64
        min: -90.0
        max: 90.0
        nullable: false
        source: <mechanical tilt, degrees; negative is uptilt>
      <tx-power-column>:
        dtype: float64
        nullable: false
        source: <transmit power, dBm>
