# @package kpi
# Thresholds defining the KPIs, the objective's parameters, and the capacity
# model behind the serving rule, the served ratio and the PRB demand map.

# Strongest signal at or below which a location is a coverage hole. Also the
# RSRP a cell-band must exceed to serve a UE, and the objective's coverage
# threshold T_cov.
hole_dbm: -120.0

# Upper bound of weak coverage; the lower bound is hole_dbm.
weak_dbm: -90.0

# Inclusive margin within which a co-band neighbour overlaps the serving cell.
# Also the objective's Delta_R.
overlap_margin_db: 6.0

# J = mean_g sigmoid((R_s - T_cov) / tau_R) * exp(-beta * m_g)
# (src/optim/objective.py, ADR 0006).
objective:
  # tau_R: width of the coverage sigmoid on (R_s - T_cov), in dB.
  tau_r_db: 30.0
  # Each co-band overlapping neighbour keeps q_ov = exp(-beta) of the utility.
  beta: 0.5

# Reported network-quality measures that the objective does not read.
quality:
  # Percentile of serving RSRP taken as the cell edge, over covered locations
  # only: the 5% point of 3GPP TR 36.814 Annex A.2.1.4.
  edge_percentile: 5.0

# Serving-cell choice and PRB demand (src/kpi/capacity.py).
capacity:
  # Serving band preference, most preferred first. Must list every band.
  band_preference: [b2600, b1800, b700]
  # Below this the preferred band is skipped for the next one. Equal to
  # hole_dbm here, which makes that skip unreachable: a layer that low is not a
  # candidate at all. Raise it above hole_dbm to put the rule back in play.
  rsrp_threshold_dbm: -120.0
  # A cell-band admits no further UE once its load exceeds this share of
  # max_prb; the UE passes to its next candidate.
  max_admission_utilisation: 0.7
  # Assumed required throughput of each UE; sets PRBs per UE.
  throughput_per_ue_bps: 20000000 # 20 Mbps
  # scs_hz: subcarrier spacing; a PRB is 12 subcarriers (TS 38.211 4.4.4.1).
  # Only the PRB bandwidth uses it. SINR noise is kTB over the band bandwidth
  # (simulation.radio_map). The PRB limit per cell-band is
  # simulation.transmitters.cells[].max_prb.
  bands:
    b2600: {scs_hz: 15000} # 15 kHz
    b1800: {scs_hz: 15000} # 15 kHz
    b700: {scs_hz: 15000} # 15 kHz
