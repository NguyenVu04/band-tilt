# @package kpi
# Thresholds and weights defining the four KPIs, plus the capacity model behind
# the serving rule and the PRB demand map.

# Strongest signal at or below which a location is a coverage hole.
hole_dbm: -120.0

# Upper bound of weak coverage; the lower bound is hole_dbm.
weak_dbm: -90.0

# Inclusive margin within which a co-band neighbour overlaps the serving cell.
overlap_margin_db: 6.0

# Band Priority Score weights, keyed by band label and normalised to [0, 1].
# Sorted descending, they are also the serving-cell band preference.
band_priority:
  b2600: 3.0
  b1800: 2.0
  b700: 1.0

# Tie thresholds for the lexicographic pick. The priority order needs these to
# bind: hole rate is continuous, so exact ties never occur, and without a
# tolerance the comparison never reaches the second objective.
#
# Each sits at the ray tracer's run-to-run spread under a changed solver seed.
# Below that a difference is Monte-Carlo noise rather than a property of the
# tilts, so it counts as a tie and the next objective decides.
tolerance:
  hole_rate: 0.002
  overlap_rate: 0.001
  band_priority_score: 0.001
  weak_rate: 0.004

# Serving-cell choice and PRB demand (src/kpi/capacity.py). The serving band is
# what the Band Priority Score counts. Every value is a PLACEHOLDER pending the
# maintainer's numbers.
capacity:
  # Below this the preferred band is skipped for the next one.
  rsrp_threshold_dbm: -90.0
  # Assumed required throughput of each UE; sets PRBs per UE.
  throughput_per_ue_bps: 40000000 # 40 Mbps
  # scs_hz: subcarrier spacing; a PRB is 12 subcarriers (TS 38.211 4.4.4.1).
  # Only the PRB bandwidth uses it. SINR noise is kTB over the band bandwidth
  # (simulation.radio_map), as sionna-rt's RadioMap.sinr computes it. The PRB
  # limit per cell-band is simulation.transmitters.cells[].max_prb.
  bands:
    b2600: {scs_hz: 15000}
    b1800: {scs_hz: 15000}
    b700: {scs_hz: 15000}
