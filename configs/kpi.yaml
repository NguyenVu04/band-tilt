# @package kpi
# KPI thresholds and the capacity model.

# Best-server RSRP at or below this is a coverage hole [dBm].
hole_dbm: -120.0

# Upper bound of weak coverage; the lower bound is hole_dbm [dBm].
weak_dbm: -90.0

# A co-band sector within this margin of the strongest one overlaps it [dB].
overlap_margin_db: 6.0

# Serving-cell choice and estimated throughput (src/kpi/capacity.py).
capacity:
  # Share of max_prb shared equally among a sector-band's UEs.
  max_admission_utilisation: 0.8
