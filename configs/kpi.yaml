# @package kpi
# KPI thresholds and the capacity model.

# Best-server RSRP at or below this is a coverage hole [dBm].
hole_dbm: -120.0

# Upper bound of weak coverage; the lower bound is hole_dbm [dBm].
weak_dbm: -90.0

# A co-band cell within this margin of the strongest one overlaps it [dB].
overlap_margin_db: 6.0

# Serving-cell choice and PRB demand (src/kpi/capacity.py).
capacity:
  # Serving band order, most preferred first. Must list every band.
  band_preference: [b2600, b1800, b700]
  # Below this RSRP the next band is tried [dBm].
  rsrp_threshold_dbm: -120.0
  # Largest share of max_prb a cell-band may be loaded to.
  max_admission_utilisation: 0.8
  # Throughput each UE requires [bit/s].
  throughput_per_ue_bps: 10000000 # 10 Mbps
