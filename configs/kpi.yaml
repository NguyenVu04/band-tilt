# @package kpi
# Thresholds and weights defining the five KPIs.

# Strongest signal at or below which a location is a coverage hole.
hole_dbm: -120.0

# Upper bound of weak coverage; the lower bound is hole_dbm.
weak_dbm: -90.0

# Inclusive margin within which a co-band neighbour overlaps the serving cell.
overlap_margin_db: 6.0

# Band Priority Score weights, keyed by band label and normalised to [0, 1].
band_priority:
  b2600: 3.0
  b1800: 2.0
  b700: 1.0

# Sigmoid sensitivity of the Expected RSRP Improvement, in dB. A change of this
# size scores 0.73. Set above simulation.mdt.rsrp_noise_sigma_db so a difference
# the size of the UE's own measurement error still scores near 0.5.
rsrp_improvement_tau_db: 3.0

# Tie thresholds for the lexicographic pick. The priority order needs these to
# bind: hole rate is continuous, so exact ties never occur, and without a
# tolerance the comparison never reaches the second objective.
#
# Each sits at the ray tracer's run-to-run spread under a changed solver seed -
# except where noted below. Below that a difference is Monte-Carlo noise rather
# than a property of the tilts, so it counts as a tie and the next objective
# decides.
tolerance:
  hole_rate: 0.002
  overlap_rate: 0.001
  # UNMEASURED placeholder. Every other entry here was measured; this one has
  # not been, because the KPI is new. Re-derive it the same way - re-solve the
  # baseline tilt under several solver seeds and take the spread - before
  # reporting any result against it. Too tight and this slot never ties, so band
  # priority and weak rate stop binding; too loose and it stops binding itself.
  expected_rsrp_improvement: 0.002
  band_priority_score: 0.001
  weak_rate: 0.004
