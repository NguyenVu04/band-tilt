# @package kpi
# Thresholds and weights defining the KPIs, plus the capacity model behind the
# serving rule, the served ratio and the PRB demand map.
#
# Every threshold below is read twice: once hard, by the rate a deployment
# reads, and once softly per tile, by the desirability the search maximises
# (ADR 0005). There is no separate soft threshold to keep in step.

# Strongest signal at or below which a location is a coverage hole. Also the
# RSRP a cell-band must exceed to serve a UE. hole_desirability softens it as
# sigmoid(R_max - hole_dbm), in dB.
hole_dbm: -120.0

# Upper bound of weak coverage; the lower bound is hole_dbm.
weak_dbm: -90.0

# Inclusive margin within which a co-band neighbour overlaps the serving cell.
# overlap_desirability softens it as sigmoid(delta - overlap_margin_db) on each
# neighbour's RSRP difference below the server, so a neighbour exactly this far
# down scores a half instead of falling off a step.
overlap_margin_db: 6.0

# Weights of the quality index (src/optim/objective.py `quality_index`): the
# geometric mean renormalises them to sum to one, so only their ratios matter.
# They are judgement values in ADR 0001's priority order. Finite, non-negative,
# not all zero. Nothing else reads them - the reported rates carry no weights,
# because nothing sums them.
weights:
  hole_desirability: 3.0
  overlap_desirability: 2.0
  served_desirability: 1.0

# Reported network-quality measures that no score reads.
quality:
  # Percentile of serving RSRP taken as the cell edge, over covered locations
  # only: the 5% point of 3GPP TR 36.814 Annex A.2.1.4.
  edge_percentile: 5.0

# Serving-cell choice and PRB demand (src/kpi/capacity.py). Every value is a
# PLACEHOLDER pending the maintainer's numbers.
capacity:
  # Serving band preference, most preferred first. Must list every band.
  band_preference: [b2600, b1800, b700]
  # Below this the preferred band is skipped for the next one.
  rsrp_threshold_dbm: -120.0
  # Assumed required throughput of each UE; sets PRBs per UE.
  throughput_per_ue_bps: 20000000 # 20 Mbps
  # scs_hz: subcarrier spacing; a PRB is 12 subcarriers (TS 38.211 4.4.4.1).
  # Only the PRB bandwidth uses it. SINR noise is kTB over the band bandwidth
  # (simulation.radio_map). The PRB limit per cell-band is
  # simulation.transmitters.cells[].max_prb.
  bands:
    b2600: {scs_hz: 15000} # 15 kHz
    b1800: {scs_hz: 15000} # 15 kHz
    b700: {scs_hz: 15000} # 15 kHz
