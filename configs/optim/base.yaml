# @package optim
# Optimization over the absolute-tilt space: one tilt per cell-band pair.

output:
  # One directory per run, under <dir>/<method>/<timestamp>.
  dir: outputs/optim
  # Where the deliverable — the tilt change — is republished after every run,
  # one file per method, overwritten.
  deliverable_dir: reports/outputs
  # Whether to archive the winning configuration's radio map.
  save_radio_map: true

seed: ${seed}

# Solutions published for choice, best first. The incumbent and the
# priority-order pick are always among them, so this is the total and not an
# addition to them. It bounds what an operator is asked to read, not what the
# run computes: every candidate is measured either way.
n_solutions: 8
