# @package optim
# Tilt optimization: one absolute tilt per cell-band.

output:
  # Run directories, as <dir>/<method>/<timestamp>.
  dir: outputs/optim
  # Latest deliverable per method, overwritten each run.
  deliverable_dir: reports/outputs
  # Save the winner's radio map with the run.
  save_radio_map: true

seed: ${seed}

# Number of published solutions, best first, incumbent included.
n_solutions: 4
