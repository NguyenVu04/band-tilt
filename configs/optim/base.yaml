# @package optim
# Tilt optimization: one absolute tilt per sector-band.

output:
  # Run directories, as <dir>/<method>/<timestamp>.
  dir: outputs/optim
  # Latest deliverable per method, overwritten each run.
  deliverable_dir: reports/outputs
  # Save the winner's radio map with the run.
  save_radio_map: true

seed: ${seed}

# Evaluation budget every method shares, so a comparison between methods is at
# equal cost. The method files read it as optim.method.budget.
budget:
  # Initial design points, labelled `init`.
  n_init: 16
  # Evaluations after the initial design.
  n_iter: 128

# Number of published solutions: the incumbent, the winner, then by objective.
n_solutions: 4
