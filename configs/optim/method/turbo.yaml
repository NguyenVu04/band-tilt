# @package optim.method
# TuRBO-1 (Eriksson et al., 2019) on the objective, budget matched to random.yaml.

name: turbo

budget:
  # Sobol points before the trust region starts; a restart spends another set.
  n_init: 16
  # Trust-region evaluations.
  n_iter: 128
  # Candidates per GP refit.
  batch_size: 3

# Trust region in the unit cube.
trust_region:
  length_init: 0.8
  # Restart below this length (0.5 ** 7).
  length_min: 0.0078125
  length_max: 1.6
  # Successful rounds before the region grows.
  success_tolerance: 3
  # Relative gain a round needs to count as a success.
  improvement: 1.0e-3
  # Expected number of dimensions perturbed per candidate.
  perturbed_dimensions: 5
