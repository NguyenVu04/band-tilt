# @package scenario
# The synthetic-data generator: the grid, the UE population over time and the
# node/sector layout drawn over the scene. Re-run `task simulation:scenario`
# after changing any block. It writes the files simulation.input names, which
# nothing else regenerates; real data can stand in for them.

# Grid shared by UE density and radio maps.
grid:
  # Tile side [m].
  tile_size_m: 20.0
  # Ray casts per tile side (n x n per tile).
  subsamples_per_tile: 4
  # Highest surface still counted as open ground [m].
  free_height_tol_m: 0.5

# UE population; each interval is an independent draw.
ue:
  # UEs per interval, inclusive range.
  count_range: [10, 20]
  # UE height: the radio stage's plane.
  height_m: ${simulation.ue.height_m}

# Traffic over time.
time:
  # Interval length [s].
  interval_s: 900.0 # 15 minutes
  # Simulated duration [s].
  horizon_s: 604800.0 # 7 days
  # Day/night swing, below 1.
  diurnal_amplitude: 0.6
  # AR(1) correlation, below 1.
  ar1_rho: 0.85
  # AR(1) shock scale; 0 gives the plain diurnal profile.
  ar1_sigma: 0.25

# UE density: uniform background plus Gaussian hotspots.
density:
  # Share of UEs in hotspots.
  hotspot_mass_fraction: 0.7
  # Number of hotspots.
  n_hotspots: 4
  # Major-axis sigma range [m].
  sigma_major_m: [80.0, 200.0]
  # Minor-axis sigma range [m], capped at the major axis.
  sigma_minor_m: [40.0, 120.0]
  # Radius for the building volume that weights hotspot centres [m].
  built_volume_radius_m: 150.0
  # Least building volume, as a share of the densest area, for a hotspot centre.
  min_built_volume_fraction: 0.5
  # Least distance between hotspot centres [m].
  min_hotspot_distance_m: 500.0

# Multi-band sectors on four nodes: a centre node and three around it at 120 deg.
layout:
  # Inter-site distance, centre node to each corner node [m]; the corners are
  # sqrt(3) times this apart. SMa, TR 38.901 V19.2.0 Table 7.2-5: ISD 1299 m
  # (1732 m the alternative); Table 7.2-1: 500 m UMa, 1732 m RMa.
  node_spacing_m: 1299.0
  # Sectors per node, evenly spaced in azimuth.
  sectors_per_node: 3
  # Azimuth of the first sector [deg].
  azimuth_offset_deg: 45.0
  # Mast height above ground [m]; SMa h_BS, TR 38.901 V19.2.0 Table 7.2-5, is 35 m
  # (Table 7.2-1: 25 m UMa, 35 m RMa).
  mast_height_m: 35.0
  # Least open-ground share at a mast site.
  min_free_fraction: 0.95
  # Open-ground clearance around a mast [m].
  clearance_radius_m: 20.0
  # Search radius for open ground near a node [m].
  snap_radius_m: 250.0
  # Incumbent tilt of every sector, per band [deg].
  default_tilt:
    b2600: {baseline_deg: 10.0, bounds_deg: [0.0, 20.0]}
    b1800: {baseline_deg: 10.0, bounds_deg: [0.0, 20.0]}
    b700: {baseline_deg: 10.0, bounds_deg: [0.0, 20.0]}
  # PRB limit of every sector, per band: N_RB at 15 kHz SCS (TS 38.101-1
  # Table 5.3.2-1). Keep in step with simulation.radio_map.bands.
  default_max_prb: {b2600: 216, b1800: 106, b700: 52}

seed: ${seed}

# Generator outputs beyond simulation.input: what was drawn and how, read
# only by src/scenario and the notebooks.
output:
  record_file: data/scenes/${simulation.scene_name}/synthetic.json
