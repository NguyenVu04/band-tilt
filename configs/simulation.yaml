# Radio-map solver settings. Each band is solved separately.
radio_map:
  # Scene temperature used for thermal-noise power.
  temperature: 298.15
  # Rays launched per transmitter.
  samples_per_tx: 10000000
  # Longest path the solver traces, in interactions.
  max_depth: 5
  # Propagation mechanisms recorded with each output map.
  los: true
  specular_reflection: true
  # Enables the material scattering coefficient.
  diffuse_reflection: false
  refraction: true
  # Diffraction settings; enabling diffraction is expensive.
  diffraction: false
  edge_diffraction: false
  diffraction_lit_region: true
  # Russian-roulette depth; -1 disables it.
  rr_depth: -1
  rr_prob: 0.95
  # Integer Hz values avoid YAML scientific-notation parsing issues.
  bands:
    - name: b2600
      frequency: 2600000000
      bandwidth: 100000000
    - name: b1800
      frequency: 1800000000
      bandwidth: 100000000
    - name: b700
      frequency: 700000000
      bandwidth: 100000000

# Sionna-RT planar arrays; spacings are in wavelengths.
antenna:
  # Per-resource-element reference-signal power in dBm.
  power_rs: 4.85

  # Cross-polarized macro-sector array.
  transmitter:
    num_rows: 8
    num_cols: 8
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "tr38901"
    polarization: "cross"

  # Single vertical dipole; UEs do not beamform.
  receiver:
    num_rows: 1
    num_cols: 1
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "dipole"
    polarization: "V"

# Synthetic UE reports derived from the clean radio map.
mdt:
  # Independent receiver measurement error.
  rsrp_noise_sigma_db: 2.0
  # Randomly unreported share of eligible measurements.
  drop_fraction: 0.3
  # Never drop the strongest cell or cells within this margin.
  protect_within_db: 6.0
  protect_strongest_n: 1

# Output artifacts for scenario inputs, clean maps, and synthetic reports.
output:
  ue_file: data/external/ue_positions.csv
  manifest_file: data/external/scenario.json
  radio_map_file: data/interim/radio_map.npz
  mdt_file: data/interim/mdt.csv

# Base seed. GPU ray-map accumulation is not bit-reproducible.
seed: ${seed}
