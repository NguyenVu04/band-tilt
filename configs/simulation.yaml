# @package simulation
# Scenario inputs for the Sionna-RT scene, UE population, and radio maps.

scene:
  # Bundled Sionna-RT scene name.
  name: munich
  # Use a mono-polarized CUDA variant required by Sionna-RT.
  mitsuba_variant: cuda_ad_mono_polarized
  # Keep buildings separate so they can be perturbed.
  merge_shapes: false

# Region of interest
area:
  # Keep UEs, hotspots, and masts away from scene edges.
  margin_m: 0.0

# Measurement grid shared by UE density and radio maps.
grid:
  # Cell side length.
  cell_size_m: 20.0
  # Sub-grid side length; each cell uses n² ray casts.
  subsamples_per_cell: 4
  # Maximum surface height treated as open ground.
  free_height_tol_m: 0.5

# UE samples weight radio-map cells; each interval is an independent draw.
ue:
  # Inclusive per-interval UE-count range.
  count_range: [40, 80]
  # UE plane; must match the radio-map height.
  height_m: 1.5

# Time-varying mixture masses over a fixed spatial density.
time:
  # Snapshot duration.
  interval_s: 3600.0 # 1 hour
  # Total simulated duration.
  horizon_s: 604800.0 # 7 days
  # Day/night intensity swing; must stay below 1.
  diurnal_amplitude: 0.6
  # AR(1) log-intensity correlation; must stay below 1.
  ar1_rho: 0.85
  # Scale of the AR(1) shocks. Zero leaves the bare diurnal profile.
  ar1_sigma: 0.25

# UE density: uniform open-ground background plus Gaussian hotspots.
density:
  # Hotspot UE share; remaining UEs use the uniform background.
  hotspot_mass_fraction: 0.9
  # How many hotspots. Their centres are drawn afresh per scenario.
  n_hotspots: 4
  # Range the major axis is drawn uniformly from.
  sigma_major_m: [80.0, 200.0]
  # Range the minor axis is drawn from, clamped to at most the major.
  sigma_minor_m: [40.0, 120.0]
  # Radius used to weight hotspot centres by nearby building volume.
  built_volume_radius_m: 250.0

# Per-scenario geometry deviations from the delivered scene.
perturbation:
  remove:
    # Buildings deleted outright.
    n_buildings: 20
  jitter:
    # Buildings given random height, offset, and rotation.
    n_buildings: 40
    # Height multiplier about the ground plane.
    height_scale: [0.85, 1.20]
    # Survey-error bounds for footprint position and orientation.
    position_m: 2.0
    orientation_deg: 3.0

# Per-band static materials derived from ITU-R P.2040 coefficients.
materials:
  perturbation:
    # Multiplies the ITU value.
    relative_permittivity_scale: [0.90, 1.10]
    conductivity_scale: [0.70, 1.30]
    # Absolute range; used only with diffuse reflection.
    scattering_coefficient: [0.0, 0.3]

# Co-sited multi-band sectors on a square site lattice.
transmitters:
  layout:
    # Distance between neighbouring sites on the lattice.
    site_spacing_m: 650.0
    # Sectors per site, at evenly spaced azimuths.
    sectors_per_site: 3
    # Rotation applied to every site's sector fan.
    azimuth_offset_deg: 0.0
    # Mast height above local ground.
    mast_height_m: 30.0
    # Minimum estimated open-ground share for mast placement.
    min_free_fraction: 0.95
    # Required open-ground clearance around each mast.
    clearance_radius_m: 20.0
    # How far to look for open ground when the ideal lattice position has none.
    # Finding none fails the generator rather than placing a mast on a building.
    snap_radius_m: 150.0
    # Initial per-band tilt for generated sectors.
    default_tilt:
      b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
      b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
      b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
  # Generated against the unperturbed scene and held fixed across scenarios.
  sectors:
    - name: s0c0
      x: -380.34
