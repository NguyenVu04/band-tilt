# --- Radio configuration -----------------------------------------------------
# Each band is a separate solve: Scene.frequency is a scene-level property, so a
# scene cannot hold two carriers at once. Tilt is not here — the decision
# variable is one absolute tilt per cell-band pair, so it lives on the sector.
radio_map:
  # Scene temperature. With bandwidth it fixes the thermal noise power.
  temperature: 298.15
  # Rays shot per transmitter. A fidelity decision, not only a cost one: too few
  # leave cells with no path at all, which reads downstream as a coverage hole
  # rather than as an unresolved cell.
  samples_per_tx: 10000000
  # Longest path the solver traces, in interactions.
  max_depth: 5
  # Which propagation mechanisms the solver models. Named here rather than left
  # to a library default, which could change between releases and silently
  # change what "ground truth" means. All of them are recorded in the output.
  los: true
  specular_reflection: true
  # Carries materials.perturbation.scattering_coefficient; without it that part
  # of the scene perturbation does nothing.
  diffuse_reflection: false
  refraction: true
  # Matters more as frequency falls, so without it the low band's coverage
  # advantage is understated. Expensive: enabling it can turn a sub-second solve
  # into one that does not finish in minutes.
  diffraction: false
  edge_diffraction: false
  diffraction_lit_region: true
  # Russian roulette: terminates weak paths probabilistically instead of
  # truncating every path at max_depth, trading variance for time without bias.
  # -1 disables it.
  rr_depth: -1
  rr_prob: 0.95
  # One solve per band per tilt configuration. Frequencies and bandwidths are
  # integers in Hz: YAML 1.1 needs a signed exponent, so `2.6e9` would parse as
  # a string and reach Sionna-RT as one. `name` is the only place a band's
  # identity is spelled — the tilt table and the MDT columns both use it.
  bands:
    - name: b2600
      frequency: 2600000000
      bandwidth: 100000000
    - name: b1800
      frequency: 1800000000
      bandwidth: 100000000
    - name: b700
      frequency: 700000000
      bandwidth: 100000000

# --- Antennas ----------------------------------------------------------------
# Sionna-RT PlanarArrays. Spacings are in wavelengths, so their metric size
# follows the band being solved.
antenna:
  # Per-resource-element reference-signal power in dBm, which is what makes a
  # radio map read directly as RSRP rather than as carrier power.
  power_rs: 4.85

  # Cross-polarised (slant +/-45 degrees), the standard macro-sector
  # configuration. Several rows so the vertical pattern is narrow enough for
  # tilt to change coverage — a single element has no beam to tilt.
  transmitter:
    num_rows: 8
    num_cols: 8
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "tr38901"
    polarization: "cross"

  # A single vertical dipole: a UE is not assumed to beamform.
  receiver:
    num_rows: 1
    num_cols: 1
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "dipole"
    polarization: "V"

# --- Synthetic MDT -----------------------------------------------------------
# What a UE reports, as opposed to what is true. The clean radio map is written
# separately and never touched here: it is the surrogate's label, and noising a
# label would train the model to predict noise.
mdt:
  # Receiver measurement error. Do not raise it to stand in for shadow fading —
  # ray tracing already computes the geometric shadowing that fading is a
  # substitute for, so adding fading on top counts the buildings twice. The
  # noise is independent per measurement, which a surrogate can average away; a
  # spatially correlated residual would be the stronger model.
  rsrp_noise_sigma_db: 2.0
  # Share of eligible measurements that go unreported, since a real UE does not
  # report every cell it can hear. Modelled as random, whereas real reporting is
  # threshold-driven — a surrogate trained on this will not learn that bias.
  drop_fraction: 0.3
  # Never dropped: the strongest cell and everything within this margin of it.
  # Defaulting the margin to the KPI's own overlap margin makes the censoring
  # KPI-safe by construction, since the KPIs depend only on the server and the
  # cells within it.
  protect_within_db: 6.0
  protect_strongest_n: 1

# --- Output ------------------------------------------------------------------
# The UE table carries the grid cell each UE falls in, so per-cell counts are a
# group-by rather than a re-derivation. The manifest records the scenario — its
# id, seed and perturbations — because a scenario must be regenerable from it
# and the train/validation/test split is between whole scenarios. The map and
# the MDT are derived artifacts, so they sit apart from the scenario inputs.
output:
  ue_file: data/external/ue_positions.csv
  manifest_file: data/external/scenario.json
  radio_map_file: data/interim/radio_map.npz
  mdt_file: data/interim/mdt.csv

# --- Seed --------------------------------------------------------------------
# Everything drawn comes from this value, so a scenario is regenerable from the
# config alone. The scenario stage is bit-reproducible; the radio map is not,
# because the solver accumulates ray contributions with GPU atomics whose
# ordering varies between runs. Do not treat a checksum mismatch on the radio
# map as a bug.
seed: ${seed}
