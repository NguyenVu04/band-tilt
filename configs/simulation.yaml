# @package simulation
# Scenario inputs for the Sionna-RT scene, UE population, and radio maps.

scene:
  # A bundled Sionna-RT scene name, or a scene XML path (root-relative).
  name: munich
  # Use a mono-polarized CUDA variant required by Sionna-RT.
  mitsuba_variant: cuda_ad_mono_polarized
  # Merge buildings into one mesh per material. Nothing calls Scene.edit, so the
  # per-shape identity is not needed and the merged scene traces faster.
  merge_shapes: true

# Measurement grid shared by UE density and radio maps.
grid:
  # Tile side length.
  tile_size_m: 20.0
  # Sub-grid side length; each tile uses n² ray casts.
  subsamples_per_tile: 4
  # Maximum surface height treated as open ground.
  free_height_tol_m: 0.5

# UE samples weight radio-map tiles; each interval is an independent draw.
ue:
  # Inclusive per-interval UE-count range.
  count_range: [10, 20]
  # UE plane; must match the radio-map height.
  height_m: 1.5

# Time-varying mixture masses over a fixed spatial density.
time:
  # Snapshot duration.
  interval_s: 900.0 # 15 minutes
  # Total simulated duration.
  horizon_s: 604800.0 # 7 days
  # Day/night intensity swing; must stay below 1.
  diurnal_amplitude: 0.6
  # AR(1) log-intensity correlation; must stay below 1.
  ar1_rho: 0.85
  # Scale of the AR(1) shocks. Zero leaves the bare diurnal profile.
  ar1_sigma: 0.25

# UE density: uniform open-ground background plus Gaussian hotspots.
density:
  # Hotspot UE share; remaining UEs use the uniform background.
  hotspot_mass_fraction: 0.9
  # How many hotspots. Their centres are drawn afresh per scenario.
  n_hotspots: 4
  # Range the major axis is drawn uniformly from.
  sigma_major_m: [80.0, 200.0]
  # Range the minor axis is drawn from, clamped to at most the major.
  sigma_minor_m: [40.0, 120.0]
  # Radius used to weight hotspot centres by nearby building volume.
  built_volume_radius_m: 150.0
  # Least share of the densest neighbourhood's building volume a tile needs
  # before it may hold a hotspot centre. Keeps centres off near-empty ground.
  min_built_volume_fraction: 0.5

# Co-located multi-band cells on three nodes: the corners of an equilateral
# triangle.
transmitters:
  layout:
    # Side of the node triangle. With three nodes and no centroid this is the
    # node-to-node distance directly: the 500 m UMa inter-site distance (ISD) of
    # 3GPP TR 38.901 Table 7.2-1, whose h_BS of 25 m is mast_height_m below.
    node_spacing_m: 500.0
    # Cells per node, at evenly spaced azimuths.
    cells_per_node: 3
    # Rotation applied to every node's cell fan.
    azimuth_offset_deg: 30.0
    # Mast height above local ground.
    mast_height_m: 25.0
    # Minimum estimated open-ground share for mast placement.
    min_free_fraction: 0.95
    # Required open-ground clearance around each mast.
    clearance_radius_m: 20.0
    # How far to look for open ground when a node's ideal position has none.
    # Finding none fails the generator rather than placing a mast on a building.
    snap_radius_m: 250.0
    # Initial per-band tilt for generated cells. 5 deg is the geometric optimum
    # atan((mast_height_m - ue.height_m) / R) at the cell radius R =
    # node_spacing_m / sqrt(3); the bound leaves it well inside the box.
    default_tilt:
      b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
    # Initial per-band PRB limit for generated cells, the N_RB of each band's
    # radio_map bandwidth at 15 kHz SCS (TS 38.101-1 Table 5.3.2-1): 40 MHz is
    # 216, 20 MHz is 106, 10 MHz is 52. Must track both radio_map.bands[].bandwidth
    # and kpi.capacity.bands.scs_hz.
    default_max_prb: {b2600: 216, b1800: 106, b700: 52}
  # Generated once against the bundled scene and held fixed across scenarios.
  cells:
    - name: n0c0
      x: -4.12
      y: 107.16
      z: 25.00
      azimuth_deg: 30.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}
    - name: n0c1
      x: -4.12
      y: 107.16
      z: 25.00
      azimuth_deg: 150.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}
    - name: n0c2
      x: -4.12
      y: 107.16
      z: 25.00
      azimuth_deg: 270.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}
    - name: n1c0
      x: -241.19
      y: -309.00
      z: 25.00
      azimuth_deg: 30.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}
    - name: n1c1
      x: -241.19
      y: -309.00
      z: 25.00
      azimuth_deg: 150.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}
    - name: n1c2
      x: -241.19
      y: -309.00
      z: 25.00
      azimuth_deg: 270.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}
    - name: n2c0
      x: 315.92
      y: -350.56
      z: 25.00
      azimuth_deg: 30.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}
    - name: n2c1
      x: 315.92
      y: -350.56
      z: 25.00
      azimuth_deg: 150.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}
    - name: n2c2
      x: 315.92
      y: -350.56
      z: 25.00
      azimuth_deg: 270.0
      tilt:
        b2600: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b1800: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
        b700: {baseline_deg: 5.0, bounds_deg: [0.0, 15.0]}
      max_prb: {b2600: 216, b1800: 106, b700: 52}

# Radio-map solver settings. Each band is solved separately.
radio_map:
  # Scene temperature used for thermal-noise power.
  temperature: 298.15
  # Rays launched per transmitter.
  samples_per_tx: 10000000
  # Longest path the solver traces, in interactions.
  max_depth: 8
  # Propagation mechanisms recorded with each output map.
  los: true
  specular_reflection: true
  # Enables the material scattering coefficient.
  diffuse_reflection: false
  refraction: true
  # Diffraction settings; enabling diffraction is expensive.
  diffraction: false
  edge_diffraction: false
  diffraction_lit_region: true
  # Russian-roulette depth; -1 disables it.
  rr_depth: -1
  rr_prob: 0.95
  # Integer Hz values avoid YAML scientific-notation parsing issues.
  bands:
    - name: b2600
      frequency: 2600000000 # 2.6 GHz
      bandwidth: 40000000 # 40 MHz
    - name: b1800
      frequency: 1800000000 # 1.8 GHz
      bandwidth: 20000000 # 20 MHz
    - name: b700
      frequency: 700000000 # 700 MHz
      bandwidth: 10000000 # 10 MHz

# Sionna-RT planar arrays; spacings are in wavelengths.
antenna:
  # Per-resource-element reference-signal power in dBm.
  power_rs: 4.85

  # Cross-polarized macro-cell array.
  transmitter:
    num_rows: 8
    num_cols: 8
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "tr38901"
    polarization: "cross"

  # Single vertical dipole; UEs do not beamform.
  receiver:
    num_rows: 1
    num_cols: 1
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "dipole"
    polarization: "V"

# Synthetic UE reports derived from the clean radio map.
mdt:
  # Independent receiver measurement error.
  rsrp_noise_sigma_db: 4.0

# Output artifacts for scenario inputs, clean maps, and synthetic reports.
output:
  ue_file: data/external/ue_positions.csv
  manifest_file: data/external/scenario.json
  radio_map_file: data/interim/radio_map.npz
  mdt_file: data/interim/mdt.csv

# Base seed. GPU ray-map accumulation is not bit-reproducible.
seed: ${seed}
