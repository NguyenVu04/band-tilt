# @package simulation
# Sionna-RT: the inputs it reads, scene loading, radio-map solver and antenna
# arrays. The synthetic-data generator (configs/scenario.yaml) writes the inputs
# below; real data can replace them without that generator.

# Folder under data/scenes/ holding scene.xml, its mesh/, the cell table and the manifest.
scene_name: hanoi

# The files the radio stage, preprocessing and the search read.
input:
  # Scene XML path, or a bundled Sionna-RT scene name.
  scene_file: data/scenes/${simulation.scene_name}/scene.xml
  # One row per UE per interval (src/core/ue.py).
  ue_file: data/external/ue_positions.csv
  # One row per cell-band (src/core/cell.py).
  cells_file: data/scenes/${simulation.scene_name}/cells.csv
  # Scenario id, grid and time schedule.
  manifest_file: data/scenes/${simulation.scene_name}/scenario.json

ue:
  # UE height, also the radio-map plane [m].
  height_m: 1.5

scene:
  # Mitsuba variant; Sionna-RT needs a mono-polarized CUDA one.
  mitsuba_variant: cuda_ad_mono_polarized
  # Merge shapes per material; traces faster.
  merge_shapes: true

# Radio-map solver, one solve per band.
radio_map:
  # Noise temperature [K].
  temperature: 298.15
  # Rays launched per transmitter.
  samples_per_tx: 10000000
  # Longest path the solver traces, in interactions.
  max_depth: 8
  # Propagation mechanisms.
  los: true
  specular_reflection: true
  diffuse_reflection: false
  refraction: true
  # Diffraction is expensive.
  diffraction: false
  edge_diffraction: false
  diffraction_lit_region: true
  # Russian roulette; depth -1 disables it.
  rr_depth: -1
  rr_prob: 0.95
  # Frequencies in integer Hz. bandwidth sets max_prb (keep
  # scenario.layout.default_max_prb in step); scs_hz is the per-RE
  # noise bandwidth and a PRB is 12 subcarriers of it.
  bands:
    - name: b2600
      frequency: 2600000000 # 2.6 GHz
      bandwidth: 40000000 # 40 MHz
      scs_hz: 15000 # 15 kHz
    - name: b1800
      frequency: 1800000000 # 1.8 GHz
      bandwidth: 20000000 # 20 MHz
      scs_hz: 15000 # 15 kHz
    - name: b700
      frequency: 700000000 # 700 MHz
      bandwidth: 10000000 # 10 MHz
      scs_hz: 15000 # 15 kHz

# Sionna-RT planar arrays; spacings in wavelengths.
antenna:
  # Reference-signal power per resource element [dBm].
  power_rs: 4.85

  # Macro-cell array.
  transmitter:
    num_rows: 8
    num_cols: 8
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "tr38901"
    polarization: "cross"

  # UE antenna: one vertical dipole.
  receiver:
    num_rows: 1
    num_cols: 1
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "dipole"
    polarization: "V"

# Radio-map output.
output:
  radio_map_file: data/interim/radio_map.npz
