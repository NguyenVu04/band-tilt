# --- Radio configuration -----------------------------------------------------
# temperature sits beside the bands rather than inside one because Sionna-RT
# carries a single scene temperature; with bandwidth it fixes the thermal noise
# power (Scene.thermal_noise_power = temperature * k_B * bandwidth).
#
# Each band is a separate solve. Scene.frequency is a scene-level property, so a
# scene cannot hold two carriers at once and a tilt configuration costs one
# solve per band listed here.
#
# Frequencies and bandwidths are integers in Hz. Do not rewrite them in
# scientific notation: YAML 1.1 requires a signed exponent, so `2.6e9` parses as
# a string and would reach Sionna-RT as one.
#
# `name` identifies a band in the per-sector tilt table and in the MDT column
# names. It is the only place a band's identity is spelled, so the two cannot
# drift apart.
#
# Tilt is NOT here. The decision variable is one absolute tilt per CELL-BAND
# pair (PROJECT.md 3.1), so it lives on the sector, under transmitters.sectors.
# A tilt stated per band would force every sector of a band to point alike and
# would remove exactly the freedom this project optimizes.
#
# samples_per_tx and max_depth are a FIDELITY decision, not only a cost one:
# too few rays leave cells with no path at all, which reads downstream as a
# coverage hole rather than as an unresolved cell. They were raised until the
# share of reached cells stopped moving sharply; a lower setting understates
# coverage everywhere.
#
# diffraction and diffuse_reflection are both OFF, and max_depth is modest, so
# a band solves in about a second. That is a deliberate trade of fidelity for
# runtime, and it costs two specific things a report must acknowledge:
#
#   - Diffracted paths are MISSING. Diffraction matters more as frequency falls
#     (at 700 MHz the wavelength is 0.43 m), so the low band's coverage
#     advantage is understated and the band comparison is not complete.
#   - materials.perturbation.scattering_coefficient is INERT. Scattering only
#     reaches the result through diffuse reflection, so that component of the
#     scene perturbation currently does nothing.
#
# The cost of turning them on is not marginal: measured on this scene, a band
# solving in under a second here had not finished after fifteen minutes with
# diffraction enabled, and a three-band run at max_depth 8 did not complete the
# first band within eight minutes. A surrogate dataset needs hundreds of such
# solves, so that is a decision about hardware, not about a config flag.
#
# To raise fidelity for a one-off without editing this block:
#   task simulation:radio -- simulation.radio_map.diffraction=true \
#       simulation.radio_map.diffuse_reflection=true \
#       simulation.radio_map.max_depth=8
# Maps solved at different settings are different ground truths and must never
# be mixed into one dataset. The settings are recorded inside every
# radio_map.npz so a stray archive can be identified.
radio_map:
  temperature: 298.15
  samples_per_tx: 10000000
  max_depth: 5
  diffraction: false
  diffuse_reflection: false
  bands:
    - name: b2600
      frequency: 2600000000
      bandwidth: 100000000
    - name: b1800
      frequency: 1800000000
      bandwidth: 100000000
    - name: b700
      frequency: 700000000
      bandwidth: 100000000

# Antenna arrays, in Sionna-RT's PlanarArray terms. Spacings are in wavelengths,
# so their metric size follows the band being solved.
#
# power_rs is the per-resource-element reference-signal power in dBm, which is
# what makes a radio map read directly as RSRP rather than as carrier power.
#
# The transmit array is cross-polarised (slant +/-45 degrees), which is the
# standard macro-sector configuration, and has several rows so the vertical
# pattern is narrow enough for tilt to change coverage — a single element has no
# beam to tilt. The receive array is a single vertical dipole: a UE is not
# assumed to beamform.
antenna:
  power_rs: 4.85

  transmitter:
    num_rows: 8
    num_cols: 8
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "tr38901"
    polarization: "cross"

  receiver:
    num_rows: 1
    num_cols: 1
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    pattern: "dipole"
    polarization: "V"

# --- Synthetic MDT -----------------------------------------------------------
# What a UE reports, as opposed to what is true. The clean radio map is written
# separately and never touched by this block: the surrogate's LABEL is the
# ray-traced map, and MDT is a feature, so noising the label would train the
# model to predict noise.
#
# rsrp_noise_sigma_db is receiver measurement error only. Do NOT raise it to
# stand in for shadow fading: ray tracing already computes the geometric
# shadowing that log-normal fading is a substitute for, so adding fading on top
# counts the buildings twice.
#
# The noise is independent per measurement, which is the weak choice — a
# surrogate averages independent noise away, so it tests very little. A
# spatially correlated residual would be the stronger model.
#
# Censoring: a real UE does not report every cell it could hear. drop_fraction
# of the eligible measurements become blank, EXCEPT the strongest cell and
# everything within protect_within_db of it. That margin defaults to the KPI's
# own overlap margin, which makes the censoring KPI-safe by construction: hole
# rate, weak rate, overlap rate and mean overlap neighbours all depend only on
# the server and the cells within that margin, so no drop can move them.
#
# This models missingness as random. Real reporting is threshold-driven, so what
# goes unreported is strongly correlated with how weak it is; a surrogate
# trained on this will not learn that bias.
mdt:
  rsrp_noise_sigma_db: 2.0
  drop_fraction: 0.3
  protect_within_db: 6.0
  protect_strongest_n: 1

# --- Output ------------------------------------------------------------------
# The UE positions carry the grid cell each falls in, so the per-cell counts the
# band-priority KPI needs are a group-by away rather than a re-derivation
# against the grid.
#
# The manifest records the scenario: its id, its seed, and which buildings were
# removed and jittered. A scenario must be regenerable from it, because train,
# validation and test split between whole scenarios.
#
# The radio map and MDT are derived artifacts rather than scenario inputs, so
# they sit in data/interim rather than beside the UE table.
output:
  ue_file: data/external/ue_positions.csv
  manifest_file: data/external/scenario.json
  radio_map_file: data/interim/radio_map.npz
  mdt_file: data/interim/mdt.csv

# --- Seed --------------------------------------------------------------------
# Everything drawn — the sub-grid jitter, the perturbation, the hotspots, the UE
# positions, the material draw and the measurement noise — comes from this
# value, so a scenario is regenerable from the config alone.
#
# The scenario stage IS bit-reproducible. The radio map is not, and cannot be
# made so here: the solver accumulates ray contributions with GPU atomics, whose
# ordering varies between runs. Measured on this scene the run-to-run spread is
# about 1e-5 dB, with an identical no-path pattern; downstream that leaves every
# censoring decision unchanged and a handful of MDT values differing in the last
# written digit. Reproducibility is therefore to well below measurement noise,
# not to the byte — do not treat a checksum mismatch on the radio map as a bug.
seed: ${seed}
