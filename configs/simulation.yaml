# @package simulation
# Simulation environment — the Sionna-RT scene and the UE population drawn over
# it.
#
# Read by src/simulation/, which takes every path and every parameter from this
# block. The scene's extent is NOT configured: it is read from the loaded scene
# at run time (src/simulation/scene.py), because a restated bound does not raise
# when it drifts, it silently samples UEs off the geometry.

scene:
  # A scene bundled with sionna-rt, resolved by name against sionna.rt.scene.
  name: munich
  # Mitsuba's compute variant. It MUST be a mono_polarized one: sionna-rt packs
  # a 2x2 Jones matrix into mi.Spectrum, which holds four components only
  # there. Any other variant loads the scene and rasters it perfectly well and
  # then fails deep inside the radio solvers with a bare Color3f size error, so
  # src/simulation/scene.py rejects one up front.
  #
  # A CUDA GPU is required: the llvm variants fail to initialise on some hosts,
  # leaving no CPU fallback, so the variant is stated here rather than left to
  # sionna-rt's own selection — which is itself only consulted when nothing has
  # set a variant first.
  mitsuba_variant: cuda_ad_mono_polarized
  # Merging shapes that share a radio material speeds the solver up, but it
  # collapses a city into a handful of per-material blobs, and a building that
  # is no longer a distinct object cannot be perturbed.
  merge_shapes: false

# --- Measurement grid --------------------------------------------------------
# The scene is rastered into square cells. The grid is what the UE density is
# defined over and what the UE counts are binned into; a later radio-map stage
# is expected to share it, so cell_size_m is a decision about KPI spatial
# resolution as much as about sampling.
#
# subsamples_per_cell is the side of the sub-grid cast per cell, so a value of
# n costs n^2 rays per cell. It buys the FRACTION of a cell that is open
# ground: a binary centre-hit test would give a half-blocked cell the same
# weight as an open one, and would drop edge cells whose centre falls outside
# the scene entirely.
#
# free_height_tol_m separates ground from building. The scene's ground is a
# single flat surface, so a downward ray returns a surface height and anything
# above this tolerance is a structure standing on it.
grid:
  cell_size_m: 20.0
  subsamples_per_cell: 4
  free_height_tol_m: 0.5

# --- UE population -----------------------------------------------------------
# UEs are WEIGHTS on the radio map, not ray-tracing targets: no solve is run per
# UE, so count trades against file size rather than against compute. Prefer a
# count high enough to make the per-cell counts smooth.
#
# height_m is the plane UEs sit on, and must match the height any later radio
# map is computed at — a KPI weighted by UEs at one height against a map solved
# at another is comparing two different surfaces.
ue:
  count: 5000
  height_m: 1.5

# --- UE spatial density ------------------------------------------------------
# The density is deliberately NOT uniform. The UE-weighted Band Priority Score
# asks whether high-frequency layers serve high-demand areas; under a flat
# density there is no such area, the KPI cannot discriminate, and the optimizer
# has nothing to exploit.
#
# The field is a mixture: a uniform background over all open ground, plus
# elliptical Gaussian hotspots.
#
# hotspot_mass_fraction is the share of UEs drawn from the hotspots; the
# remainder is background. Concentration is parameterised HERE, as one number,
# rather than through per-hotspot amplitudes — amplitudes interact with the
# sigmas and the cell count in a way that makes a sweep over them
# uninterpretable. With this key, n_hotspots and the sigmas control shape only.
#
# The background share must stay above zero. At zero, cells outside every
# hotspot carry no UE weight, the band-priority KPI goes blind to them, and a
# configuration that abandons coverage there is scored as free.
#
# Hotspot centres are drawn per scenario, weighted by built_volume_radius_m
# worth of surrounding building volume, and restricted to cells with open
# ground. Weighting by built volume puts demand in dense street canyons, where
# propagation is worst — that tension between where users are and where
# coverage is cheap is the coverage-and-capacity problem. Hotspots placed in
# open squares would remove it. The open-ground restriction guards a centre
# landing inside a building, which would leave its mass on a ring of whatever
# open cells happen to surround the block.
#
# The sigma ranges are drawn from uniformly, minor clamped to at most major.
density:
  hotspot_mass_fraction: 0.7
  n_hotspots: 6
  sigma_major_m: [80.0, 200.0]
  sigma_minor_m: [40.0, 120.0]
  built_volume_radius_m: 150.0

# --- Scene perturbation ------------------------------------------------------
# What this scenario's city gets wrong about the real one. The perturbations
# define the SCENARIO: train, validation and test split between whole scenarios
# so a surrogate is measured on environments it has never seen.
#
# Buildings do not slide sideways or swivel. position_m and orientation_deg
# model SURVEY ERROR — the footprints a scene is built from carry position and
# orientation error — and the report must say so rather than describing them as
# urban change. Keep them small: a large offset drives buildings through each
# other, which is not an error any survey makes.
#
# height_scale is applied about the ground plane, so a building keeps its base
# and changes its roof. Scaling about the mesh centroid, which is Sionna's own
# behaviour, would sink the base as far as it raised the roof.
perturbation:
  remove:
    n_buildings: 20
  jitter:
    n_buildings: 40
    height_scale: [0.85, 1.20]
    position_m: 2.0
    orientation_deg: 3.0

# --- Radio materials ---------------------------------------------------------
# The bundled scenes ship ITU materials whose permittivity and conductivity are
# recomputed from ITU-R P.2040 on every frequency change. That both forbids
# sub-GHz carriers (P.2040 Table 3 starts at 1 GHz for concrete, brick, marble
# and metal, and sionna-rt raises rather than extrapolating) and silently
# discards any perturbation applied to them.
#
# They are therefore replaced with plain materials carrying no frequency-update
# callback, evaluated per band from the same ITU coefficients with the validity
# range deliberately not enforced. The extrapolation is mild — the frequency
# exponent is zero for every material these scenes use, so permittivity is
# unchanged and only conductivity moves — but it is outside the range P.2040
# validates, and a report using a sub-GHz band has to say so.
#
# The scales multiply the ITU value; scattering_coefficient is absolute because
# ITU defines none. Scattering only reaches the result when the solver runs
# with diffuse reflection enabled, and is otherwise inert.
materials:
  perturbation:
    relative_permittivity_scale: [0.90, 1.10]
    conductivity_scale: [0.70, 1.30]
    scattering_coefficient: [0.0, 0.3]

# --- Transmitters ------------------------------------------------------------
# Sites sit on a square lattice about the scene centre, each carrying evenly
# spaced sectors; every band is co-sited, because multi-band tilt COORDINATION
# is only a problem when the bands share a footprint.
#
# Deliberately few sites. Spread too densely over a small scene, every location
# is strongly served by something, hole rate pins near zero and overlap near
# one whatever the tilt, and the KPIs stop responding to the decision variable.
#
# `sectors` is generated once by `task simulation:layout` against the
# UNPERTURBED scene and then held fixed: perturbations model our uncertainty
# about the city, not changes an operator reacts to, and a real mast stays
# where it was surveyed even when the survey turns out to be wrong.
transmitters:
  layout:
    site_spacing_m: 650.0
    sectors_per_site: 3
    azimuth_offset_deg: 0.0
    # Surface heights that count as a mountable roof, and the mast above it.
    rooftop_height_range_m: [12.0, 35.0]
    mast_clearance_m: 3.0
    snap_radius_m: 60.0
    # The tilt a freshly generated layout stamps on every sector, per band.
    # Higher bands start tilted harder, to contain a smaller footprint. This is
    # only a starting point: the sector table below is the authority, and its
    # entries are meant to diverge under optimization.
    default_tilt:
      b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
      b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
      b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
  # Generated by `task simulation:layout`. z is the mast height above the
  # scene's ground plane, resolved against the roof each site stands on.
  #
  # THIS TABLE IS THE DECISION VARIABLE. One tilt per cell-band pair — 12
  # sectors times 3 bands — is the vector PROJECT.md 3.1 optimizes, so it is
  # written out in full rather than derived from a per-band default. Every
  # sector needs an entry for every band in radio_map.bands; the radio stage
  # checks that up front and names any gaps.
  #
  # baseline_deg must lie inside bounds_deg, or the run starts from a
  # configuration the optimizer is not allowed to be in.
  sectors:
    - name: s0c0
      x: -382.85
      y: -410.78
      z: 19.23
      azimuth_deg: 0.0
      tilt:
        b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
        b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
        b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
    - name: s0c1
      x: -382.85
      y: -410.78
      z: 19.23
      azimuth_deg: 120.0
      tilt:
        b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
        b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
        b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
    - name: s0c2
      x: -382.85
      y: -410.78
      z: 19.23
      azimuth_deg: 240.0
      tilt:
        b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
        b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
        b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
    - name: s1c0
      x: -404.99
      y: 248.03
      z: 15.84
      azimuth_deg: 0.0
      tilt:
        b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
        b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
        b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
    - name: s1c1
      x: -404.99
      y: 248.03
      z: 15.84
      azimuth_deg: 120.0
      tilt:
        b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
        b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
        b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
    - name: s1c2
      x: -404.99
