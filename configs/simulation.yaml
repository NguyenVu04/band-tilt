# @package simulation
# The Sionna-RT scene, the UE population drawn over it, and the radio maps
# solved on it. Read by src/simulation/.
#
# The scene's extent is not configured: it is read from the loaded scene at run
# time, because a restated bound does not raise when it drifts — it silently
# samples UEs off the geometry.

scene:
  # A scene bundled with sionna-rt, resolved by name against sionna.rt.scene.
  name: munich
  # Mitsuba compute variant. Must be a mono_polarized one: sionna-rt packs a 2x2
  # Jones matrix into mi.Spectrum, which holds four components only there. A
  # CUDA GPU is required; the llvm variants fail to initialise on some hosts.
  mitsuba_variant: cuda_ad_mono_polarized
  # Merging shapes that share a radio material is faster, but a building that is
  # no longer a distinct object cannot be perturbed.
  merge_shapes: false

# --- Region of interest ------------------------------------------------------
area:
  # How far inside the scene edge UEs, hotspot centres and masts may be placed.
  # Near the boundary there is no geometry beyond the edge to block anything, so
  # the radio map reads optimistically there. The grid and the map still span
  # the full scene. Must leave room for the site lattice below.
  margin_m: 100.0

# --- Measurement grid --------------------------------------------------------
# Square cells the scene is rastered into. The UE density is defined over them
# and the radio map shares them, so this is the spatial resolution of every KPI.
grid:
  # Cell side.
  cell_size_m: 20.0
  # Side of the sub-grid cast per cell, so n^2 rays each. It buys the fraction
  # of a cell that is open ground; a binary centre hit would weigh a
  # half-blocked cell like an open one.
  subsamples_per_cell: 4
  # Surface height at or below which a point is ground rather than a building.
  # The scene's ground is a single flat surface.
  free_height_tol_m: 0.5

# --- UE population -----------------------------------------------------------
# UEs are weights on the radio map, not ray-tracing targets: no solve is run per
# UE, so the count trades against file size rather than compute. Each interval
# is an independent draw, so UEs carry no identifier across intervals.
ue:
  # Inclusive range the per-interval UE count is drawn uniformly from. A range
  # rather than a fixed number so load varies snapshot to snapshot.
  count_range: [20, 50]
  # The plane UEs sit on. Must match the height the radio map is solved at,
  # otherwise the KPIs weigh one surface by another.
  height_m: 1.5

# --- Time axis ---------------------------------------------------------------
# A fresh population is drawn every interval over the horizon; a trailing
# part-interval is dropped. This costs no extra ray tracing, since every
# interval reads the same map. What varies is which mixture component holds the
# population, never where a component puts it.
time:
  # Length of one snapshot.
  interval_s: 1800.0
  # Total simulated span.
  horizon_s: 604800.0
  # Depth of the deterministic day/night swing. Each hotspot gets its own peak
  # hour, so demand migrates between them rather than breathing in place. Must
  # stay below 1 to keep every intensity positive.
  diurnal_amplitude: 0.6
  # Correlation between consecutive intervals in the log intensity. Redrawing
  # independently would make demand white noise, which cannot be tuned against.
  # Must stay below 1 for the process to be stationary.
  ar1_rho: 0.85
  # Scale of the AR(1) shocks. Zero leaves the bare diurnal profile.
  ar1_sigma: 0.25

# --- UE spatial density ------------------------------------------------------
# Deliberately not uniform: the UE-weighted band-priority KPI asks whether
# high-frequency layers serve high-demand areas, and under a flat density there
# is no such area. The field is a uniform background over open ground plus
# elliptical Gaussian hotspots.
density:
  # Share of UEs drawn from the hotspots; the rest is background. Concentration
  # is one number here rather than per-hotspot amplitudes, which interact with
  # the sigmas and make a sweep uninterpretable. Must stay below 1, or cells
  # outside every hotspot carry no weight and abandoning coverage there is free.
  hotspot_mass_fraction: 0.9
  # How many hotspots. Their centres are drawn afresh per scenario.
  n_hotspots: 3
  # Range the major axis is drawn uniformly from.
  sigma_major_m: [80.0, 200.0]
  # Range the minor axis is drawn from, clamped to at most the major.
  sigma_minor_m: [40.0, 120.0]
  # Radius of surrounding building volume a candidate hotspot centre is weighted
  # by. Weighting by built volume puts demand in dense street canyons, where
  # propagation is worst — that tension is the coverage-and-capacity problem.
  built_volume_radius_m: 150.0

# --- Scene perturbation ------------------------------------------------------
# What this scenario's city gets wrong about the real one. The perturbations
# define the scenario: train, validation and test split between whole scenarios.
perturbation:
  remove:
    # Buildings deleted outright.
    n_buildings: 20
  jitter:
    # Buildings given a random height, offset and rotation.
    n_buildings: 40
    # Height multiplier, applied about the ground plane so a building keeps its
    # base and moves its roof.
    height_scale: [0.85, 1.20]
    # Survey error, not urban change: the footprints a scene is built from carry
    # position and orientation error. Keep both small, or buildings are driven
    # through each other.
    position_m: 2.0
    orientation_deg: 3.0

# --- Radio materials ---------------------------------------------------------
# The bundled ITU materials recompute permittivity and conductivity from
# ITU-R P.2040 on every frequency change, which forbids sub-GHz carriers (the
# tables start at 1 GHz) and discards any perturbation applied to them. They are
# replaced with plain materials evaluated per band from the same coefficients,
# with the validity range deliberately not enforced — a report using a sub-GHz
# band has to say so.
materials:
  perturbation:
    # Multiplies the ITU value.
    relative_permittivity_scale: [0.90, 1.10]
    conductivity_scale: [0.70, 1.30]
    # Absolute, because ITU defines none. Inert unless the solver runs with
    # diffuse reflection enabled.
    scattering_coefficient: [0.0, 0.3]

# --- Transmitters ------------------------------------------------------------
# Sites sit on a square lattice about the scene centre. Every band is co-sited,
# because multi-band tilt coordination is only a problem when the bands share a
# footprint. Deliberately few sites: spread too densely, every location is
# strongly served whatever the tilt and the KPIs stop responding to it.
transmitters:
  layout:
    # Distance between neighbouring sites on the lattice.
    site_spacing_m: 650.0
    # Sectors per site, at evenly spaced azimuths.
    sectors_per_site: 3
    # Rotation applied to every site's sector fan.
    azimuth_offset_deg: 0.0
    # Height of the mast above the ground it stands on. Tying the height to the
    # tower rather than to whatever roof is nearby keeps the sites comparable.
    mast_height_m: 30.0
    # Share of a tile that must be open ground before a mast may stand on it.
    # Below 1 because the raster estimates the share from a sub-sampled cast, so
    # an unobstructed tile beside a wall can read slightly short.
    min_free_fraction: 0.95
    # Every tile within this radius must also be free, so a mast is not wedged
    # against a facade it would immediately shadow.
    clearance_radius_m: 20.0
    # How far to look for open ground when the ideal lattice position has none.
    # Finding none fails the generator rather than placing a mast on a building.
    snap_radius_m: 150.0
    # The tilt a freshly generated layout stamps on every sector, per band.
    # Higher bands start tilted harder, to contain a smaller footprint. Only a
    # starting point: the sector table below is the authority afterwards, and
    # its entries are meant to diverge under optimization.
    default_tilt:
      b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
      b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
      b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
  # Generated by `task simulation:layout` against the unperturbed scene and then
  # held fixed: a real mast stays where it was surveyed even when the survey
  # turns out to be wrong. z is the ground under the site plus mast_height_m.
  sectors:
    - name: s0c0
      x: -380.34
      y: -489.80
      z: 30.00
      azimuth_deg: 0.0
      tilt:
        b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
        b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
        b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
    - name: s0c1
      x: -380.34
      y: -489.80
      z: 30.00
      azimuth_deg: 120.0
      tilt:
        b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
        b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
        b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
    - name: s0c2
      x: -380.34
      y: -489.80
      z: 30.00
      azimuth_deg: 240.0
      tilt:
        b2600: {baseline_deg: 8.0, bounds_deg: [0.0, 16.0]}
        b1800: {baseline_deg: 6.0, bounds_deg: [0.0, 14.0]}
        b700: {baseline_deg: 4.0, bounds_deg: [0.0, 12.0]}
    - name: s1c0
