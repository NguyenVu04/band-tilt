# @package surrogate
# The radio-map surrogate: f_sur(x, tilt) -> R_hat.
#
# The surrogate exists because a Sionna-RT evaluation is too expensive to put
# inside an optimization loop.
#
# It predicts the RADIO MAP, not the KPIs. src/kpi/ then
# derives the five KPIs from whatever map it is given, so there is exactly one
# KPI implementation and it does not care whether the map was ray-traced or
# predicted. Regressing the KPIs directly would create a second code path and
# would tie the trained model to the current KPI thresholds.

# --- Dataset ---------------------------------------------------------------
# D_sur = {(x, tilt, R)} — built by src/surrogate/dataset.py from radio maps
# generated under configs/radio.yaml `sampling`.
dataset:
  path: data/processed/surrogate_dataset.parquet
  # Split by SCENARIO, never by grid cell or by individual record
  # (src/data/split.py). A scenario is one environment plus one UE mobility
  # realisation; samples inside it share buildings, materials and trajectories,
  # so splitting within one leaks the very structure the sim-to-reality study
  # is trying to measure.
  split_on: scenario
  test_size: 0.2
  val_size: 0.2
  seed: ${seed}

# --- Features --------------------------------------------------------------
# The feature vector x: environment, network and
# MDT-derived features. src/surrogate/features.py builds the tensor; this block
# declares what goes into it.
features:
  # Absolute tilt per cell-band — always present, this is the decision variable.
  tilt: true
  # Static geometry that does not vary with tilt: position, height, azimuth.
  cell_geometry: <true|false>
  # UE density per grid cell from src/data/ue_density.py.
  ue_density: <true|false>
  # Band identity and its priority weight w_b.
  band_identity: <true|false>
  # Neighbour structure: which cells are close enough to overlap.
  neighbor_graph: <true|false>
  # Scenario-level environment descriptors — building footprints, materials.
  # These are what make the sim-to-reality study possible: a
  # surrogate that never sees the environment cannot generalise across
  # perturbed scenarios, it can only memorise the one it trained on.
  scene_features: <true|false>

# --- Target ----------------------------------------------------------------
# The surrogate predicts the RSRP radio map R over the evaluation grid, indexed
# (cell_band, grid_cell). The five KPIs
# are derived from the prediction by src/kpi/, not regressed.
target:
  kind: radio_map
  # dBm, matching the Sionna-RT reference exactly. Never predict a normalised
  # quantity without recording the inverse transform here: the KPI thresholds
  # are absolute dBm levels and a scale error moves every one of them.
  units: dbm
  # Shape is (n_cell_bands, |G|) per sample, both fixed by configs/radio.yaml.
  shape_from: [radio.bands, radio.cells, radio.grid]

# --- Model -----------------------------------------------------------------
# The architecture is left open. Instantiated by Hydra's
# _target_, so swapping architectures is a config edit.
#
# The output is a map, not five numbers, so this is a dense spatial prediction
# problem — the natural architectures are encoder/decoder rather than tabular
# regressors. Whatever is chosen, TuRBO fits its own GP over the KPIs derived
# from the prediction (configs/optim/bo.yaml), so the surrogate itself is not
# required to expose a posterior; if it does, record how the uncertainty is
# propagated through the KPI evaluator rather than discarding it silently.
_target_: src.surrogate.model.<ClassName>
model:
  <hyperparameter-a>: <value>
  <hyperparameter-b>: <value>

optim:
  lr: 1.0e-3
  weight_decay: 0.0

train:
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 10

artifact_path: models/surrogate.pkl

# --- Acceptance ------------------------------------------------------------
# Pipeline Phase 5. The surrogate is only useful if
# its error is small relative to the KPI differences the optimizer is trying to
# resolve. If predicted hole rate is off by more than the improvement being
# claimed, the optimization result is noise.
#
# Acceptance has TWO layers, because the surrogate now predicts a map and the
# KPIs are derived from it:
#
#   1. radio-map error, in dB, against the Sionna-RT reference;
#   2. the error this produces in each derived KPI, in that KPI's own units.
#
# Layer 2 is the one that decides acceptance. A small average map error can still
# move hole rate a long way, because hole rate is a hard threshold at -120 dBm:
# error concentrated at the coverage edge costs far more than the same error in
# the cell centre. Report both, and never substitute layer 1 for layer 2.
acceptance:
  # Layer 1 — radio-map prediction error over all (cell_band, grid_cell) entries.
  radio_map:
    max_rmse_db: <acceptable RMSE in dB>
    max_mae_db: <acceptable MAE in dB>
    # Error restricted to locations near the hole and weak thresholds, where a
    # dB of error flips a classification rather than shifting a value.
    max_mae_db_near_threshold: <acceptable MAE in dB>
  # Layer 2 — error in the KPIs derived from the predicted map by src/kpi/.
  # Reported per KPI, never averaged: a surrogate that is excellent on weak rate
  # and useless on hole rate is useless, because hole rate is the
  # highest-priority objective.
  max_mae:
    hole_rate: <acceptable MAE in percentage points>
    overlap_rate: <acceptable MAE in percentage points>
    mean_overlap_neighbors: <acceptable MAE in neighbours>
    band_priority_score: <acceptable MAE in score units>
    weak_rate: <acceptable MAE in percentage points>
  # Also report error restricted to the best-performing decile of
  # configurations: accuracy near the optimum is what the optimizer needs, and
  # a global average hides it.
  report_near_optimum: true
  # And on held-out PERTURBED scenarios, not just held-out configurations of the
  # training scenario. Generalising across tilts is a
  # weaker claim than generalising across environments, and only the second one
  # supports the sim-to-reality conclusion.
  report_held_out_scenarios: true
