# The reproducible pipeline. `dvc repro` runs what is out of date, in order.
#
# The stages mirror PROJECT.md section 16 and the notebooks one-to-one, and both
# call the same functions in src/ — a notebook and a stage cannot diverge.
#
# Two stages are active: `mobility` and the legacy `clean_split`. The rest are
# commented because they depend on parameters PROJECT.md section 22.2 leaves
# open (band table, tilt bounds, grid resolution, surrogate architecture) and
# on the multi-band cell configuration that has not arrived yet. Uncomment
# each as its inputs become real.
#
# Note the `params` blocks. DVC re-runs a stage when a listed parameter changes,
# so the entries are chosen to be the settings that actually invalidate a stage's
# output — not every key in the file.

stages:
  # --- Phase 2: UE mobility generation (notebook 01) -------------------------
  # The first non-legacy stage in this file. Requires SUMO
  # (`uv sync --extra sumo`, or a system SUMO with SUMO_HOME set) and the
  # DVC-tracked road network and scene.
  #
  # The scene file is a dependency even though no ray tracing happens here: it
  # is where the coordinate frame and the clip bounds come from
  # (src.mobility.frame, src.radio.scene), so a rebuilt scene invalidates
  # every trajectory generated against the old one.
  #
  # `output` is deliberately absent from `params`: a path is not part of what
  # a scenario is (see src.data.scenario.scenario_id), so changing where
  # trajectories are written should not force a re-run.
  #
  # `data/external/simulation_map/mesh/` (4,737 files) is deliberately not a
  # dep — it would make `dvc status` slow, and `scene.xml` already changes
  # whenever the mesh is regenerated by the same tool.
  mobility:
    cmd: python -m src.mobility.simulate
    deps:
      - src/mobility/
      - src/data/scenario.py
      - src/radio/scene.py
      - data/external/simulation_map/scene.net.xml
      - data/external/simulation_map/scene.xml
    params:
      - configs/mobility.yaml:
          - network
          - frame
          - ue
          - arrival
          - routing
          - run
          - sampling
          - clip
          - seed
          - perturbation
    outs:
      - data/interim/trajectories

  # --- LEGACY: cleaning the retired operator MDT export ---------------------
  # No notebook calls this any more. MDT is now synthetic (PROJECT.md sections 6
  # and 9) and the scenario-level split belongs to the surrogate dataset stage.
  # Kept until src/data/ is reworked; see CLAUDE.md, Known gaps.
  clean_split:
    cmd: python -m src.data.clean
    deps:
      - src/data/clean.py
      - src/data/load.py
      - src/data/schema.py
      - src/data/split.py
      - data/raw/measurement_data.csv
      - data/external/gcell_conf.csv
    params:
      - configs/data.yaml:
          - clean
          - split
          - schema
    outs:
      - data/processed/mdt_train.parquet
      - data/processed/mdt_test.parquet

  # --- Phase 4: radio maps and the surrogate dataset (notebook 03) ----------
  # The expensive stage: one ray-tracing solve per sampled configuration. The
  # ray-tracing settings and the grid geometry define the labels, so a change to
  # either invalidates every existing sample rather than adding to it — which is
  # exactly what DVC's params dependency expresses.
