# The reproducible pipeline. `dvc repro` runs what is out of date, in order.
#
# The stages mirror the Taskfile targets and the notebooks one-to-one, and both
# call the same functions in src/ — a notebook and a stage cannot diverge.
#
# Seven stages are active: the three `simulation_*` stages (notebook 00),
# `preprocessing` (notebook 02), `surrogate_dataset` and `surrogate_train`
# (notebooks 03a and 03b) and `optimization` (notebooks 04a and 04b).
# MARL and held-out validation still have no code in src/, so there is nothing
# to define a stage against. Add those when the modules land instead of
# guessing at their shape now.
#
# `optimization` is deliberately not wired into a downstream stage. It writes a
# timestamped directory per run, because comparing methods means comparing runs
# and a rerun must not overwrite the one it is compared against — so it has no
# fixed `outs` for DVC to track. `dvc repro optimization` runs whichever method
# the `optim/method` default in `configs/config.yaml` currently selects.
#
# It is also only the first of the two optimization phases. The search scores
# candidates with the surrogate and writes an unverified run; `task optim:report`
# then re-solves that run's front with Sionna-RT and completes it. The report is
# not a stage here for the same reason: it edits one timestamped directory in
# place and has no fixed output either.
#
# Note the `params` blocks. DVC re-runs a stage when a listed parameter changes,
# so the entries are chosen to be the settings that actually invalidate a stage's
# output — not every key in the file. A setting that only affects an upstream
# stage's own output is not repeated here: the upstream stage's `outs` already
# is this stage's `deps`, so a change there triggers a rerun through that path.

stages:
  # --- Stage 1: the scenario (notebook 00, section 3) ------------------------
  # Rasters the delivered Sionna-RT scene into the shared grid and draws the
  # time-varying UE population. Fully synthetic: the scene ships with
  # Sionna-RT and the cell layout in configs/simulation.yaml was generated once
  # by `task simulation:layout`, so neither is a file dependency here.
  simulation_scenario:
    cmd: python -m src.simulation.scenario
    deps:
      - src/simulation/scenario.py
      - src/simulation/density.py
      - src/simulation/grid.py
      - src/simulation/sample.py
      - src/simulation/seeds.py
      - src/simulation/traffic.py
      - src/simulation/scene.py
    params:
      - configs/simulation.yaml:
          - scene
          - area
          - grid
          - density
          - time
          - ue
          - seed
    outs:
      - data/external/ue_positions.csv
      - data/external/scenario.json

  # --- Stage 2: the radio map (notebook 00, section 4) -----------------------
  # Rebuilds the same scene, places the cells at their configured per-band
  # tilt, and ray-traces one band at a time. The
  # expensive stage — it needs a CUDA GPU and the Sionna-RT extra
  # (`task sync:rt`, or a system install with SUMO-style env vars N/A here).
  #
  # `data/external/scenario.json` is a dependency even though this stage does
  # not read the UE table: it reads the manifest to confirm the grid and
  # scenario id it is solving against match the scenario just generated.
  simulation_radio:
    cmd: python -m src.simulation.radio
    deps:
      - src/simulation/radio.py
      - src/simulation/materials.py
      - src/simulation/seeds.py
      - src/simulation/transmitter.py
      - src/simulation/scenario.py
      - src/simulation/scene.py
      - src/simulation/grid.py
      - src/core/cell.py
      - data/external/scenario.json
    params:
      - configs/simulation.yaml:
          - scene
          - area
          - grid
          - transmitters
          - radio_map
          - antenna
          - ue
          - seed
    outs:
      - data/interim/radio_map.npz

  # --- Stage 3: the MDT (notebook 00, section 5) ------------------------------
  # Samples the clean radio map at every UE position and adds receiver noise.
  simulation_mdt:
    cmd: python -m src.simulation.mdt
    deps:
      - src/simulation/mdt.py
      - src/simulation/seeds.py
      - data/external/ue_positions.csv
      - data/interim/radio_map.npz
    params:
      - configs/simulation.yaml:
          - mdt
          - seed
    outs:
      - data/interim/mdt.csv

  # --- Stage 4: preprocessing (notebook 02) -----------------------------------
  # Verifies the simulation output against the contract named in each check
  # (configs/simulation.yaml or the scenario manifest), then writes the typed,
  # verified tables everything downstream reads. Nothing here learns from the
  # data — see the notebook's boundary rule.
  #
  # `configs/simulation.yaml` params below are the sections `src/data/schema.py`
  # cross-checks the artifacts against; a change to them can invalidate the
  # processed tables even when the upstream `deps` files themselves are
  # untouched (e.g. re-pointing at an externally regenerated artifact).
  preprocessing:
    cmd: python -m src.data.build
    deps:
      - src/data/build.py
      - src/data/load.py
      - src/data/schema.py
      - src/simulation/transmitter.py
      - src/simulation/mdt.py
      - src/simulation/radio.py
      - src/core/cell.py
      - data/external/ue_positions.csv
      - data/external/scenario.json
      - data/interim/radio_map.npz
      - data/interim/mdt.csv
    params:
      - configs/simulation.yaml:
          - transmitters
          - radio_map
          - antenna
          - ue
    outs:
      - data/processed/mdt.parquet
      - data/processed/cell.parquet

  # --- Surrogate: the tilt sweep and the scene channels (notebook 03a) ------
  # Solves every band over its whole tilt range. Cheap only because tilts
  # decompose per transmitter -- one solve at a given tilt yields all twelve
  # cells at that tilt -- which the stage verifies before it spends anything.
  # Needs a CUDA GPU and the Sionna-RT extra, like `simulation_radio`.
  surrogate_dataset:
    cmd: python -m src.surrogate.dataset
    deps:
      - src/surrogate/dataset.py
      - src/surrogate/features.py
      - src/optim/evaluator.py
      - src/simulation/radio.py
      - src/simulation/materials.py
      - src/simulation/transmitter.py
      - src/simulation/scene.py
      - src/simulation/grid.py
      - src/core/cell.py
      - data/external/scenario.json
    params:
      - configs/simulation.yaml:
          - scene
          - area
          - grid
          - transmitters
          - radio_map
          - antenna
          - ue
          - seed
      - configs/surrogate.yaml:
          - sweep
    outs:
      - data/interim/tilt_sweep.npz
      - data/interim/scene_features.npz

  # --- Surrogate: train the tilt-delta operator (notebook 03b) --------------
  # No ray tracing and no Mitsuba: the sweep and the scene channels are the
  # only inputs, which is what the previous stage caches them for.
  surrogate_train:
    cmd: python -m src.surrogate.train
    deps:
      - src/surrogate/train.py
      - src/surrogate/model.py
      - src/surrogate/dataset.py
      - data/interim/tilt_sweep.npz
      - data/interim/scene_features.npz
    params:
      - configs/surrogate.yaml:
          - model
          - train
      - configs/simulation.yaml:
          - transmitters
          - radio_map
    outs:
      - outputs/surrogate/operator.pt

  # --- Optimization, phase 1: search the tilt space (notebooks 04a and 04b) --
  # Scores every candidate with the surrogate, so this stage needs no GPU and
  # depends on the trained operator rather than on Sionna-RT. The run it writes
  # is not reportable until `task optim:report` measures its front.
  #
  # Depends on the cell table via configs/simulation.yaml rather than on
  # data/processed/cell.parquet: the search reads the committed tilt bounds from
  # the config, and the parquet is that same table in another form.
  #
  # kpi is a param because the objective IS the KPI definitions and their
  # tolerances — change a threshold and every previous run becomes incomparable.
  optimization:
    cmd: python -m src.optim.run
    deps:
      - src/optim/space.py
      - src/optim/objective.py
      - src/optim/evaluator.py
      - src/optim/history.py
      - src/optim/methods
      - src/optim/run.py
      - src/kpi
      - src/surrogate/evaluator.py
      - src/surrogate/model.py
      - src/surrogate/dataset.py
      - outputs/surrogate/operator.pt
      - data/external/scenario.json
      - data/processed/mdt.parquet
    params:
      - configs/optim/base.yaml:
          - seed
      # Every method file, not just the selected one: DVC resolves params at
      # plan time and cannot know which method the defaults list will pick.
      - configs/optim/method/mobo.yaml:
          - name
          - budget
      - configs/optim/method/random.yaml:
          - name
          - budget
      - configs/optim/method/rule.yaml:
          - name
          - n_steps
          - n_rounds
      - configs/kpi.yaml:
          - hole_dbm
          - weak_dbm
          - overlap_margin_db
          - band_priority
          - tolerance
      - configs/simulation.yaml:
          - transmitters
          - radio_map
          - antenna
          - ue
