# The reproducible pipeline. `dvc repro` runs what is out of date, in order.
# Each stage calls the same src/ functions as its notebook.
# Evaluation (notebook 04, `task evaluate`) has no stage: it reads finished runs.
# `params` list only the settings that change a stage's output.

stages:
  # Scene raster and UE population (notebook 00).
  simulation_scenario:
    cmd: python -m src.simulation.scenario
    deps:
      - src/simulation/scenario.py
      - src/simulation/density.py
      - src/simulation/grid.py
      - src/simulation/sample.py
      - src/simulation/seeds.py
      - src/simulation/traffic.py
      - src/simulation/scene.py
      - data/external/scene
    params:
      - configs/simulation.yaml:
          - scene
          - grid
          - density
          - time
          - ue
          - seed
    outs:
      - data/external/ue_positions.csv
      - data/external/scenario.json

  # Baseline radio map, one ray-trace per band (notebook 00). Needs a CUDA GPU.
  simulation_radio:
    cmd: python -m src.simulation.radio
    deps:
      - src/simulation/radio.py
      - src/simulation/materials.py
      - src/simulation/seeds.py
      - src/simulation/transmitter.py
      - src/simulation/scenario.py
      - src/simulation/scene.py
      - src/simulation/grid.py
      - src/core/cell.py
      - data/external/scene
      - data/external/scenario.json
    params:
      - configs/simulation.yaml:
          - scene
          - grid
          - transmitters
          - radio_map
          - antenna
          - ue
          - seed
    outs:
      - data/interim/radio_map.npz

  # Verify the simulation output and write the typed UE table (notebook 02).
  preprocessing:
    cmd: python -m src.data.build
    deps:
      - src/data/build.py
      - src/data/load.py
      - src/data/schema.py
      - src/simulation/transmitter.py
      - src/simulation/radio.py
      - src/simulation/sample.py
      - src/core/cell.py
      - data/external/ue_positions.csv
      - data/external/scenario.json
      - data/interim/radio_map.npz
    params:
      - configs/simulation.yaml:
          - scene
          - grid
          - transmitters
          - radio_map
          - antenna
          - ue
    outs:
      - data/processed/ue.parquet

  # Tilt search (notebooks 03a, 03b). Needs a CUDA GPU. Each run writes its own
  # timestamped directory, so there are no fixed outs; the method is the
  # `optim/method` default in configs/config.yaml.
  optimization:
    cmd: python -m src.optim.run
    deps:
      - src/optim/space.py
      - src/optim/objective.py
      - src/optim/evaluator.py
      - src/optim/history.py
      - src/optim/methods
      - src/optim/run.py
      - src/optim/report.py
      - src/kpi
      - src/simulation/radio.py
      - src/simulation/materials.py
      - src/simulation/transmitter.py
      - src/simulation/scene.py
      - src/simulation/grid.py
      - src/simulation/seeds.py
      - src/core/cell.py
      - data/external/scene
      - data/external/scenario.json
      - data/processed/ue.parquet
    params:
      - configs/optim/base.yaml:
          - seed
          - n_solutions
      # Every method file: DVC cannot know which one the defaults pick.
      - configs/optim/method/turbo.yaml:
          - name
          - budget
          - trust_region
      - configs/optim/method/random.yaml:
          - name
          - budget
      - configs/optim/method/rule.yaml:
          - name
          - n_steps
          - n_rounds
      - configs/kpi.yaml:
          - hole_dbm
          - weak_dbm
          - overlap_margin_db
          - capacity
      - configs/simulation.yaml:
          - scene
          - grid
          - transmitters
          - radio_map
          - antenna
          - ue
