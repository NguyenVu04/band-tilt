  #         - cells
  #         - antenna
  #         - grid
  #         - ray_tracing
  #         - sampling
  #     - configs/kpi.yaml:
  #         - hole_dbm
  #         - weak_dbm
  #         - overlap_margin_db
  #   outs:
  #     - data/processed/surrogate_dataset.parquet

