[project]
name = "band-tilt"
version = "1.0.0"
description = "Multi-band tilt coordination for coverage-efficient 5G/6G RAN: Sionna-RT radio maps, a KPI surrogate, and Bayesian Optimization vs. Multi-Agent RL over absolute tilt."
readme = "README.md"
# Upper bound is deliberate and temporary: hydra-core 1.3.x cannot build its
# argparse parser on Python 3.14, which breaks every @hydra.main entry point
# (`task train`, `python -m src.data.clean`, the DVC pipeline). The Compose API
# used by notebooks is unaffected. Lift the cap once hydra-core supports 3.14.
requires-python = ">=3.11,<3.14"

# ---------------------------------------------------------------------------
# Dependency policy
# ---------------------------------------------------------------------------
# Lower bounds only, no upper caps: every new project generated from this
# template resolves against current releases. Run `task upgrade`
# (`uv lock --upgrade`) whenever you want to move the pins forward.
# Raise a floor only when you actually depend on a newer API.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=25.0",
    "scikit-learn>=1.5",
    "hydra-core>=1.3.6",
    "joblib>=1.4",
]

[project.urls]
Repository = "https://github.com/NguyenVu04/band-tilt"
Issues = "https://github.com/NguyenVu04/band-tilt/issues"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[project.optional-dependencies]
# Serving and demo layer. Kept out of the training environment so the ML core
# never depends on a web framework.
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.62",
    "pydantic>=2.9",
]
# Experiment tracking. mlflow is imported lazily, so the base install works
# without this group.
tracking = ["mlflow>=3.15"]
dvc = ["dvc>=3.55"]

# Model libraries — install only what a given module actually needs.
torch = ["torch>=2.13"]

# Radio-frequency ray tracing, and the scene the UE population is drawn over.
# Required by src/simulation/, not only by the radio-map stage: the scene's
# geometry is what says where open ground is.
rt = ["sionna-rt>=2.0"]

# Bayesian Optimization over the absolute-tilt space.
bo = ["ax-platform>=0.4", "botorch>=0.12", "gpytorch>=1.13"]

# Multi-Agent RL over the same space. Ray/RLlib is deliberately not used.
marl = ["torchrl>=0.6", "tensordict>=0.6", "gymnasium>=1.0"]

viz = ["matplotlib>=3.9", "seaborn>=0.13"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "pip>=24.0"]
dev = ["pytest>=9.1", "ruff>=0.16", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are formatted by nbstripout + review, not by ruff; Markdown is
# hand-written prose and must not be reflowed.
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
# D (pydocstyle) is intentionally enabled: this template ships contracts and
# documentation rather than implementations, and lint keeps it that way.
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "D203", # incompatible with D211 (no blank line before class docstring)
    "D213", # incompatible with D212 (summary on the first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Placeholder bodies raise NotImplementedError; unused arguments are the point.
"src/**" = ["ARG001", "ARG002"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
