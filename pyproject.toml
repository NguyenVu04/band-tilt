[project]
name = "band-tilt"
version = "1.0.0"
description = "Multi-band tilt coordination for coverage-efficient 5G/6G RAN: Sionna-RT radio maps, a KPI surrogate, and Bayesian Optimization vs. Multi-Agent RL over absolute tilt."
readme = "README.md"
# Upper bound is deliberate and temporary: hydra-core 1.3.x cannot build its
# argparse parser on Python 3.14, which breaks every @hydra.main entry point
# (`task train`, `python -m src.data.clean`, the DVC pipeline). The Compose API
# used by notebooks is unaffected. Lift the cap once hydra-core supports 3.14.
requires-python = ">=3.11,<3.14"

# ---------------------------------------------------------------------------
# Dependency policy
# ---------------------------------------------------------------------------
# Lower bounds only, no upper caps: every new project generated from this
# template resolves against current releases. Run `task upgrade`
# (`uv lock --upgrade`) whenever you want to move the pins forward.
# Raise a floor only when you actually depend on a newer API.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "hydra-core>=1.3",
    "joblib>=1.4",
]

[project.urls]
Repository = "https://github.com/NguyenVu04/band-tilt"
Issues = "https://github.com/NguyenVu04/band-tilt/issues"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[project.optional-dependencies]
# Serving and demo layer (app/). Kept out of the training environment so the
# ML core never depends on a web framework.
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "pydantic>=2.9",
]
# Experiment tracking. src/utils/tracking.py imports mlflow lazily, so the base
# install works without this group.
tracking = ["mlflow>=2.16"]
# Data and artifact versioning.
dvc = ["dvc>=3.55"]
# Model libraries — install only what a given module actually needs.
torch = ["torch>=2.4"]
# Tree-based surrogate baseline for src/surrogate/model.py. Worth keeping as a
# reference point: if a neural surrogate cannot beat it on KPI prediction
# error, the extra machinery is not paying for itself.
xgboost = ["xgboost>=2.1"]
# Radio-frequency ray tracing. src/radio/ is the only package that imports it;
# Sionna-RT is the ground truth for every reported KPI (see docs/adr/0003).
rt = ["sionna-rt>=2.0"]
# UE mobility simulation (src/mobility/). Eclipse SUMO is a system package with
# its own installer, but the PyPI wheel ships the same binaries plus `sumolib`
# and `traci` as importable modules — which is what makes `import sumolib` work
# in Colab and on a machine where SUMO_HOME is not set. Without this extra,
# sumolib resolves only through a global PYTHONPATH pointing at $SUMO_HOME/tools,
# which is not recorded anywhere and not reproducible.
#
# pyproj is not optional: sumolib.net.Net.getGeoProj raises RuntimeError
# ("Network does not provide geo-projection or pyproj not installed.") without
# it, and src/mobility/frame.py derives the network-to-scene translation through
# exactly that call. A missing pyproj must fail at install time, not at run time.
#
# The floor is the version this was verified against: SUMO 1.27.1 writes FCD
# output directly as Parquet (--output.format), which is how the trajectory
# frame is read back. Older versions emit XML only.
sumo = ["eclipse-sumo>=1.27", "pyproj>=3.6"]
# Bayesian Optimization over the absolute-tilt space (src/optim/bo/).
bo = ["ax-platform>=0.4", "botorch>=0.12", "gpytorch>=1.13"]
# Multi-Agent RL over the same space (src/optim/marl/). Ray/RLlib is
# deliberately not used — see PROJECT.md sections 13 and 14.
marl = ["torchrl>=0.6", "tensordict>=0.6", "gymnasium>=1.0"]
# Plotting, used by notebooks and src/evaluation/analysis.py.
viz = ["matplotlib>=3.9", "seaborn>=0.13"]
# Notebook runtime.
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "pip>=24.0"]
# Development tooling.
dev = ["pytest>=8.3", "ruff>=0.6", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are formatted by nbstripout + review, not by ruff; Markdown is
# prose (PROJECT.md is a hand-written spec) and must not be reflowed.
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
# D (pydocstyle) is intentionally enabled: this template ships contracts and
# documentation rather than implementations, and lint keeps it that way.
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "D203", # incompatible with D211 (no blank line before class docstring)
    "D213", # incompatible with D212 (summary on the first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Placeholder bodies raise NotImplementedError; unused arguments are the point.
"src/**" = ["ARG001", "ARG002"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
